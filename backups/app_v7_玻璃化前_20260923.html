/* 列表窗口上下缓冲行数：滚动时不立即重画，超出缓冲才重画 */
const LIST_BUF = 2;
const pageByKey = {};
let subPanels = [];
const PPM = 130;
const PAGE_W = 5.0;
const PAGE_R = 7.4;   /* 2026-09-22 拉近（原 8.4 太远）*/

function redrawWidget(mesh){
  const u = mesh.userData;
  const c = u.canvas, g = c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  if(!u.widget.bare) drawPanelBg(g, c.width, c.height, u.idx || 0);
  const fn = DRAW[u.widget.type];
  /* ⚠️ 单个控件绘制失败不能炸掉整页（2026-09-22）：
     此前 buildPage 里任一控件抛异常 → 整个子空间构建中断
     → 主页已隐藏、子空间未显示 → 黑屏（只剩边缘箭头）。
     现在捕获异常：该控件留空，其余正常显示，并在控制台报出控件类型。 */
  try {
    u.regions = fn ? fn(g, c.width, c.height, u.widget, u.state, u.idx || 0) : [];
  } catch(err){
    u.regions = [];
    console.error('[DRAW.' + u.widget.type + '] 绘制失败:', err);
    if(typeof toast === 'function') toast('控件绘制失败：' + u.widget.type);
  }
  u.tex.needsUpdate = true;
  /* 列表：重画后把窗口偏移对齐到当前滚动位置 */
  if(u.listMeta) syncListWindow(mesh);
}

/* ============================================================
   长列表滚动（窗口化虚拟列表，2026-09-22）
   · 贴图只画「可见窗口 + 缓冲」→ 内存与总条数无关
   · 滚动 = 改 tex.offset.y（GPU 采样）→ 不重画
   · 滚出缓冲才重画（把窗口搬到新位置）
   · 交互：在列表上纵向拖动 = 滚动该列表（不转相机）
============================================================ */
const LIST_PX_PER_SCREEN = 2.2;    /* 纵向拖一屏 = 滚 2.2 屏内容（2026-09-22 用户反馈：原 1.6 太钝）*/

/* ============================================================
   最近访问置顶（2026-09-22）
   40 个歌单里，常用的其实就那几个 → 访问过就提到前面，
   避免每次都在长列表里翻找。
============================================================ */
const RECENT_MAX = 8;
const recentPlaylists = [];          /* 最近访问的歌单名，最新的在前 */

function touchRecent(name){
  const i = recentPlaylists.indexOf(name);
  if(i >= 0) recentPlaylists.splice(i, 1);
  recentPlaylists.unshift(name);
  if(recentPlaylists.length > RECENT_MAX) recentPlaylists.pop();
}

/* 把「最近访问」排到前面（稳定：其余保持原顺序）*/
function orderByRecent(items){
  if(!recentPlaylists.length) return items;
  const rank = new Map(recentPlaylists.map((n, i) => [n, i]));
  return items.slice().sort((a, b) => {
    const ra = rank.has(a.t) ? rank.get(a.t) : 999;
    const rb = rank.has(b.t) ? rank.get(b.t) : 999;
    return ra - rb;
  });
}

/* 查导航条关联的列表控件（按 type 匹配同空间里的列表）*/
function listNavTarget(w){
  const want = w.target || 'songrow';
  const list = pageByKey[curPageKey] || [];
  const m = list.find(x => x.userData.widget.type === want && x.userData.listMeta);
  if(!m || !m.userData.state.view) return { total:0, visible:1, scroll:0, mesh:null };
  const r = listRows(m.userData);
  return { total:r.total, visible:r.visible,
           scroll:m.userData.state.view.scrollPx, maxScroll:r.maxScrollPx, mesh:m };
}

/* 列表度量：行数 / 可见行数 / 内容总高（像素）
   ⚠️ 像素模型（2026-09-22）：标题作为「内容的第一段」参与滚动
      （标准列表行为：滚上去标题就滚走，不需要"钉住"）。
      tex.offset 是整体平移，贴图内无法钉住任何元素，故采用此模型。*/
function listRows(u){
  const n = (u.widget.items || []).length;
  const isGrid = u.widget.type === 'grid';
  const total = isGrid ? Math.ceil(n / 2) : n;   /* bars/list/songrow 都是 1 行 1 条 */
  const m = u.listMeta;
  const labelPx = m.labelPx || 0;
  const contentPx = labelPx + total * m.rowH;          /* 含标题的内容总高 */
  const maxScrollPx = Math.max(0, contentPx - m.winPx);
  const visible = Math.max(1, Math.floor((m.winPx - labelPx) / m.rowH));
  return { total, visible, contentPx, maxScrollPx, labelPx, rowH:m.rowH };
}

/* 把 tex.offset.y 对齐到当前滚动位置（GPU 侧，零重绘）
   支持亚像素 → 拖动顺滑 */
function syncListWindow(mesh){
  const u = mesh.userData, m = u.listMeta, v = u.state.view;
  if(!m || !v) return;
  if(!isFinite(v.scrollPx) || !isFinite(v.firstPx)) return;   /* 防 NaN 扩散 */
  /* ⚠️ 贴图内容以 firstPx 为起点，贴图内 y = 内容像素 - firstPx
     要显示 scrollPx 处的内容，贴图内偏移 = scrollPx - firstPx
     （此前误用 firstPx → 缓冲内滚动时画面完全不动，只在重画时跳一下）*/
  const innerPx = v.scrollPx - v.firstPx;
  const raw = 1 - m.repeatY - innerPx / m.ch;
  u.tex.offset.y = Math.max(0, Math.min(1 - m.repeatY, raw));
}

/* 重画窗口：把贴图内容搬到 scrollPx 附近 */
function rebuildListWindow(mesh){
  const u = mesh.userData, m = u.listMeta, v = u.state.view;
  if(!m || !v) return;
  const { maxScrollPx } = listRows(u);
  /* ⚠️ 防 NaN（2026-09-22）：NaN 一旦进入 scrollPx，
     Math.min/max 都无法纠正 → firstPx=NaN → DRAW 循环不执行 → 贴图全空。
     这是「列表突然啥都没有」的根因之一。 */
  if(!isFinite(v.scrollPx)) v.scrollPx = 0;
  v.scrollPx = Math.max(0, Math.min(maxScrollPx, v.scrollPx));
  /* 窗口起点：向上留 BUF 行缓冲，但不早于内容起点 */
  const winContentPx = m.ch;                            /* 贴图覆盖的内容高度 */
  v.firstPx = Math.max(0, Math.min(Math.max(0, listRows(u).contentPx - winContentPx),
                                   v.scrollPx - LIST_BUF*m.rowH));
  u.widget.__firstPx = v.firstPx;
  u.widget.__winPx   = winContentPx;
  redrawWidget(mesh);          /* 末尾会调 syncListWindow */
  syncNavFor(mesh);
}

/* 滚动（像素）*/
function scrollList(mesh, deltaPx){
  const u = mesh.userData, v = u.state.view;
  if(!u.listMeta || !v) return;
  if(!isFinite(v.scrollPx)) v.scrollPx = 0;
  if(!isFinite(deltaPx)) return;
  const { maxScrollPx, rowH } = listRows(u);
  const before = v.scrollPx;
  v.scrollPx = Math.max(0, Math.min(maxScrollPx, v.scrollPx + deltaPx));
  if(Math.abs(v.scrollPx - before) < 0.01) return;

  /* 可见区是否仍完整落在贴图覆盖范围内？是 → 只改 offset；否 → 重画 */
  const safeLo = v.firstPx;
  const safeHi = v.firstPx + u.listMeta.ch - u.listMeta.winPx;
  if(v.scrollPx >= safeLo && v.scrollPx <= safeHi) syncListWindow(mesh);
  else rebuildListWindow(mesh);
  syncNavFor(mesh);
}

/* 跳转到指定「条目」行（搜索直达 / 导航条用）
   注意：item 行号 ≠ 像素；标题占 labelPx */
/* 跳到指定「条目」行（itemRow 从 0 开始，指第 1 首歌）
   ⚠️ 语义说明（2026-09-22）：
     · itemRow = 0 → 滚到「第 1 首歌」= 标题带之下（scrollPx = labelPx）
     · 若要滚到「内容最顶部」（连标题一起看到）→ 用 scrollListTop()
   此前两者混用，调用方以为 itemRow=0 就是"回到顶部"，实际不是。 */
function scrollListTo(mesh, itemRow){
  const u = mesh.userData, v = u.state.view;
  if(!u.listMeta || !v) return;
  const { maxScrollPx, labelPx, rowH } = listRows(u);
  if(!isFinite(v.scrollPx)) v.scrollPx = 0;
  v.scrollPx = Math.max(0, Math.min(maxScrollPx, labelPx + itemRow*rowH));
  rebuildListWindow(mesh);
}

/* ⚠️ 跨空间跳转（2026-09-22，P2 专辑/歌手详情）
   详情页没有主页卡片，从列表/歌单点进去。
   与 enterSection 的区别：不走「卡片飞向镜头」转场（没有卡片），
   直接压黑 → 切换空间。 */
/* ⚠️ 空间导航栈（2026-09-22）
   起因：加了跨空间跳转（歌单→歌单详情→歌手详情）但没有历史栈，
        返回只能回主页，无法逐级返回。
   规则：
     · 从主页进入子空间（enterSection）→ 栈清空，记 [key]
     · 子空间之间跳转（gotoSpace）→ 压栈
     · 返回（exitSection）→ 弹栈；栈空则回主页 */
const spaceStack = [];
/* 保存每个空间的滚动/选中状态，返回时还原 */
const spaceState = {};

function saveSpaceState(key){
  if(!key) return;
  const ws = pageByKey[key];
  if(!ws) return;
  spaceState[key] = ws.map(m => {
    const u = m.userData;
    return {
      scrollPx: u.state.view ? u.state.view.scrollPx : 0,
      firstPx:  u.state.view ? u.state.view.firstPx : 0,
      sel: u.state.sel,
      /* 头图卡与列表的内容（跳转时被填充过）*/
      title: u.widget.type === 'headcard' ? u.widget.title : undefined,
      sub:   u.widget.type === 'headcard' ? u.widget.sub : undefined,
      stats: u.widget.type === 'headcard' ? u.widget.stats : undefined,
      label: u.widget.type === 'songrow' ? u.widget.label : undefined,
      items: u.widget.type === 'songrow' ? u.widget.items : undefined
    };
  });
}
function restoreSpaceState(key){
  const st = spaceState[key];
  const ws = pageByKey[key];
  if(!st || !ws) return;
  ws.forEach((m, i) => {
    const s = st[i];
    if(!s) return;
    const u = m.userData;
    if(u.state.view){
      u.state.view.scrollPx = s.scrollPx || 0;
      u.state.view.firstPx  = s.firstPx || 0;
      u.state.view.vel = 0;
      u.state.view.snapTo = undefined;
    }
    if(s.sel !== undefined) u.state.sel = s.sel;
    if(s.title !== undefined) u.widget.title = s.title;
    if(s.sub !== undefined) u.widget.sub = s.sub;
    if(s.stats !== undefined) u.widget.stats = s.stats;
    if(s.label !== undefined) u.widget.label = s.label;
    if(s.items !== undefined){
      u.widget.items = s.items;
      u.state.items = s.items;
    }
    rebuildListWindow(m);
  });
}

function gotoSpace(key, payload){
  if(busy) return;
  if(!PAGES[key]) return;
  busy = true;
  document.body.classList.add('busy');
  closeSheet();
  /* 压栈前保存当前空间状态（返回时还原滚动位置与内容）*/
  if(curPageKey && curPageKey !== key) saveSpaceState(curPageKey);
  wipe(true);

  setTimeout(() => {
    /* 用 payload 填充该空间的控件（如指定专辑名/歌手名）*/
    if(payload && payload.title){
      const ws = pageByKey[key] || (buildPage(key), pageByKey[key]);
      (ws || []).forEach(m => {
        const u = m.userData;
        /* 头图卡：填标题/副标题/统计 */
        if(u.widget.type === 'headcard'){
          u.widget.title = payload.title;
          u.widget.sub = payload.sub || '';
          if(payload.stats) u.widget.stats = payload.stats;
          redrawWidget(m);
        }
        /* 歌曲列表：填真实歌曲（歌单详情/歌手详情用）*/
        if(u.widget.type === 'songrow' && payload.songs){
          u.widget.items = payload.songs;
          u.state.items = payload.songs;
          u.widget.label = payload.title;
          if(u.state.view){ u.state.view.scrollPx = 0; u.state.view.firstPx = 0; }
          redrawWidget(m);
        }
      });
    } else {
      buildPage(key);
    }
    activatePage(key);
    mainGroup.visible = false;
    subGroup.visible = true;
    mode = 'sub';
    curPageKey = key;

    const p = PAGES[key];
    crumbEn.textContent = p.en;
    crumbCn.textContent = p.cn;
    document.body.classList.add('sub');
    backBtn.classList.add('on');
    backBtn.textContent = '← 返回上一级';

    /* 压栈（若栈顶不是本空间）*/
    if(spaceStack[spaceStack.length-1] !== key) spaceStack.push(key);

    wipe(false);
    busy = false;
    document.body.classList.remove('busy');
  }, 260);
}

/* ⚠️ 本地搜索引擎（2026-09-22，P3 搜索页）
   LX-Pro 调平台搜索接口；本项目无后端，直接在 REAL 数据里搜。
   4 种类型（对齐 LX-Pro SearchTypeSelector）：
     music 音乐 / singer 歌手 / album 专辑 / songlist 歌单
   返回统一结构 [{t, a, d, src, kind, key}]，供 songrow 列表显示与跳转。 */
const SEARCH_TYPES = ['music','singer','album','songlist'];
const SEARCH_TYPE_CN = { music:'音乐', singer:'歌手', album:'专辑', songlist:'歌单' };

function localSearch(q, type, limit){
  limit = limit || 200;
  const kw = String(q || '').trim().toLowerCase();
  if(!kw) return [];
  const out = [];
  const has = (s) => String(s || '').toLowerCase().includes(kw);

  if(type === 'music'){
    for(const s of (REAL.allSongs || [])){
      if(has(s.t) || has(s.a)) out.push({
        t: s.t, a: s.a, d: s.d, src: s.src, kind:'music', key: s.t
      });
      if(out.length >= limit) break;
    }
  } else if(type === 'singer'){
    for(const x of (REAL.artists || [])){
      if(has(x.t)) out.push({
        t: x.t, a: x.n + ' 首 · ' + x.alb + ' 专辑', d:'', src:'', kind:'singer', key: x.t
      });
      if(out.length >= limit) break;
    }
  } else if(type === 'album'){
    for(const x of (REAL.albums || [])){
      if(has(x.t) || has(x.a)) out.push({
        t: x.t, a: x.a + ' · ' + x.n + ' 首', d:'', src:'', kind:'album', key: x.t
      });
      if(out.length >= limit) break;
    }
  } else if(type === 'songlist'){
    for(const x of (REAL.playlists || [])){
      if(has(x.t)) out.push({
        t: x.t, a: x.n + ' 首', d:'', src:'', kind:'songlist', key: x.t
      });
      if(out.length >= limit) break;
    }
  }
  return out;
}

/* 把搜索结果填进 search 空间的 songrow
   ⚠️ 必须把关键词写回搜索栏（2026-09-22 修）：
     否则「搜完再切类型」时读不到关键词 → 不重搜 → 用户看到旧结果。 */
function applySearch(q, type){
  const key = 'search';
  const ws = pageByKey[key] || [];
  const sr = ws.find(m => m.userData.widget.type === 'songrow');
  if(!sr) return 0;
  /* 回写关键词到搜索栏（供切类型时重搜）*/
  const sm = ws.find(m => m.userData.widget.type === 'search');
  if(sm){
    sm.userData.state.value = q;
    redrawWidget(sm);
  }
  const res = localSearch(q, type);
  sr.userData.widget.items = res;
  sr.userData.state.items = res;
  sr.userData.widget.label = q
    ? (SEARCH_TYPE_CN[type] + ' · 「' + q + '」 · ' + res.length + ' 条')
    : '热门搜索';
  if(sr.userData.state.view){
    sr.userData.state.view.scrollPx = 0;
    sr.userData.state.view.firstPx = 0;
    sr.userData.state.view.vel = 0;
    sr.userData.state.view.snapTo = undefined;
  }
  sr.userData.state.sel = -1;
  rebuildListWindow(sr);
  /* 同步导航条 */
  syncNavFor(sr);
  return res.length;
}

/* 滚到内容最顶部（含标题带）——与 scrollListTo(mesh,0) 的区别见上 */
function scrollListTop(mesh){
  const u = mesh.userData, v = u.state.view;
  if(!u.listMeta || !v) return;
  v.scrollPx = 0;
  v.snapTo = undefined;
  rebuildListWindow(mesh);
}

/* ⚠️ 惯性滑动（2026-09-22 用户要求）：
   松手后按速度继续滚动，每帧衰减（摩擦系数 0.94/帧 @60fps）。
   速度降到阈值以下 → 转为吸附对齐整行。
   与 tickListSnap 互斥：有 vel 时不吸附，vel 归零后由 onUp 逻辑接管。 */
const LIST_FRICTION = 0.955;   /* 每帧保留 95.5%（越大滑越远）*/
const LIST_MIN_VEL  = 0.15;    /* px/ms：低于此值停止惯性 */
const LIST_MAX_VEL  = 6;       /* px/ms：速度上限（防异常大速度导致狂滑）*/
function tickListInertia(dt){
  const list = pageByKey[curPageKey];
  if(!list) return;
  for(const m of list){
    const v = m.userData.state && m.userData.state.view;
    if(!v || !v.vel) continue;
    /* 按帧归一化衰减（60fps 基准），保证不同帧率手感一致 */
    const decay = Math.pow(LIST_FRICTION, dt * 60);
    v.vel *= decay;
    /* ⚠️ vel 单位 px/ms → 本帧位移 = vel × dt(ms)（2026-09-22 修正量纲）*/
    scrollList(m, v.vel * dt * 1000);
    if(Math.abs(v.vel) < LIST_MIN_VEL){
      v.vel = 0;
      /* 惯性结束 → 吸附对齐整行 */
      const { labelPx, rowH } = listRows(m.userData);
      const rel = Math.max(0, v.scrollPx - labelPx);
      v.snapTo = labelPx + Math.round(rel / rowH) * rowH;
    }
  }
}

/* 松手吸附：把滚动位置缓动到整行（角度吸附）
   ⚠️ 像素模型：吸附到「条目行」的像素位置 */
function tickListSnap(dt){
  const list = pageByKey[curPageKey];
  if(!list) return;
  for(const m of list){
    const v = m.userData.state && m.userData.state.view;
    if(!v || v.snapTo === undefined) continue;
    const d = v.snapTo - v.scrollPx;
    /* ⚠️ NaN 会让 Math.abs(d)<0.5 永远为 false → snapTo 永不清除
       → 每帧无限重画（性能崩溃）。必须显式判 NaN 并清除。 */
    if(!isFinite(d) || Math.abs(d) < 0.5){
      v.scrollPx = isFinite(v.snapTo) ? v.snapTo : 0;
      v.snapTo = undefined;
      syncListWindow(m);
      syncNavFor(m);
      continue;
    }
    const step = d * Math.min(1, dt*14);
    v.scrollPx += step;
    /* 对齐过程优先只改 offset，滑出安全区才重画 */
    const m2 = m.userData.listMeta;
    const lo = v.firstPx, hi = v.firstPx + m2.ch - m2.winPx;
    if(v.scrollPx >= lo && v.scrollPx <= hi) syncListWindow(m);
    else rebuildListWindow(m);
    syncNavFor(m);
  }
}

/* 滚动后刷新关联的导航条（位置数字/滑块要跟着动）*/
function syncNavFor(mesh){
  const list = pageByKey[curPageKey] || [];
  const type = mesh.userData.widget.type;
  list.forEach(m => {
    const wd = m.userData.widget;
    if(wd.type === 'listnav' && (wd.target || 'songrow') === type){
      if(m.userData._navSkip) return;
      m.userData._navSkip = true;
      redrawWidget(m);
      m.userData._navSkip = false;
    }
  });
}

/* 按「最近访问」重排网格，并把当前项选中（保持视窗不跳）*/
function reorderGrid(mesh){
  const u = mesh.userData, v = u.state.view;
  const cur = u.state.sel;
  const curName = u.state.items[cur] && u.state.items[cur].t;
  const ordered = orderByRecent(u.state.items);
  u.state.items = ordered;
  u.widget.items = ordered;
  u.state.sel = ordered.findIndex(x => x.t === curName);
  if(v){
    /* 当前项若不在第一屏，把滚动位置带到它那里 */
    const row = Math.floor(Math.max(0, u.state.sel) / 2);
    const { visible, labelPx, rowH, maxScrollPx } = listRows(u);
    const rowTop = labelPx + row*rowH;
    if(rowTop < v.scrollPx || rowTop >= v.scrollPx + visible*rowH)
      v.scrollPx = Math.max(0, Math.min(maxScrollPx, rowTop - labelPx));
  }
  rebuildListWindow(mesh);
}

/* 导航条：按纵向比例（fy: 0=顶 1=底）跳转到对应行 */
function navSeek(navMesh, fy, targetType){
  const list = pageByKey[curPageKey] || [];
  const lm = list.find(x => x.userData.widget.type === (targetType || 'songrow') && x.userData.listMeta);
  if(!lm) return;
  const u = lm.userData, v = u.state.view;
  const { maxScrollPx } = listRows(u);
  if(maxScrollPx <= 0) return;

  /* 面板内上下留 pad（与 DRAW.listnav 一致：pad = 0.14*P）*/
  const P = navMesh.userData.canvas.width / 5;
  const padR = (0.14*P) / navMesh.userData.canvas.height;
  /* ⚠️ fy 可能是 undefined（若调用方没传）→ 必须兜底，否则 NaN 污染整条链路 */
  const safeFy = (typeof fy === 'number' && isFinite(fy)) ? fy : 0;
  const t = Math.max(0, Math.min(1, (safeFy - padR) / Math.max(1e-6, 1 - 2*padR)));
  v.scrollPx = t * maxScrollPx;
  if(!isFinite(v.scrollPx)) v.scrollPx = 0;
  rebuildListWindow(lm);
}

function makeWidgetMesh(w, idx, wwOv, hhOv){
  const ww = wwOv || w.w || PAGE_W;
  const hh = hhOv || w.h || widgetHeight(w);
  /* 小控件用更高像素密度，保证清晰 */
  const ppm = Math.max(PPM, Math.round(620 / ww));
  const P = ww * ppm / 5 * (w.pscale || 1);

  let cw = Math.round(ww*ppm);
  let ch = Math.round(hh*ppm);
  let lyricMeta = null;
  let listMeta  = null;

  if(w.type === 'lyric3d'){
    /* 画布按「最多行数」定高，避免切歌时重建贴图 */
    const maxLines = Math.max.apply(null, TRACKS.map(t => t.lyrics.length));
    const lh = 0.62*P;
    ch = Math.round(lh * (maxLines + 1.8));
    lyricMeta = { lh, top: lh*1.3, ch, repeatY: 1 };
  }

  /* ⚠️ 列表类控件：窗口化虚拟列表（2026-09-22）
     真实规模可达数百上千首，绝不能整列画进贴图
     （500 首需 ~48400px 高 → 撞 canvas 16384 上限 + 114MB 内存）。
     做法：画布只画「可见窗口 + 上下各 LIST_BUF 行」，滚动改 tex.offset.y。 */
  /* ⚠️ bars 也纳入窗口化列表（2026-09-22）：排行可能有几十条，
     此前它是静态绘制，条数多时既被裁切、也无法翻动。
     现与 songrow 用同一套虚拟滚动机制。 */
  /* ⚠️ toggle 也纳入（2026-09-22）：设置页每区 6~10 项，需可滚动 */
  if(w.type === 'songrow' || w.type === 'list' || w.type === 'grid' || w.type === 'bars' || w.type === 'toggle'){
    const Pp = cw/5;                       /* 与 DRAW 里的 P 一致（不含 pscale）*/
    let rowH;
    if(w.type === 'grid'){
      const padPx = 0.30*Pp, gapPx = 0.26*Pp;
      const cwv = (cw - 2*padPx - gapPx) / 2;
      rowH = cwv*0.74 + 0.90*Pp;
    } else if(w.type === 'list'){
      rowH = 0.85*Pp;
    } else if(w.type === 'bars'){
      rowH = 0.72*Pp;
    } else if(w.type === 'toggle'){
      rowH = 0.82*Pp;
    } else {
      rowH = 0.78*Pp;
    }
    const winPx = hh * ppm;                /* 面板可见高度（像素）*/
    /* ⚠️ 标题占的内容高度必须与各控件 DRAW 里的 labelH 一致，
       否则滚动窗口与内容错位。实测各控件值不同：
         songrow 0.90 / grid 0.74 / bars 0.68 / list 0.64 */
    let labelRatio = 0.74;
    if(w.type === 'bars')         labelRatio = 0.68;
    else if(w.type === 'songrow') labelRatio = 0.90;
    else if(w.type === 'list')    labelRatio = 0.64;
    else if(w.type === 'toggle')  labelRatio = 0.68;
    const labelPx = w.label ? labelRatio*Pp : 0;
    ch = Math.round(winPx + 2*LIST_BUF*rowH);
    listMeta = { rowH, winPx, labelPx, ch, repeatY: winPx/ch };
  }

  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const faceMat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:1, toneMapped:false, fog:false });
  const sideMat = new THREE.MeshBasicMaterial({ color:0x1C2026, transparent:true, opacity:1, fog:false });

  let mesh;
  if(w.bare){
    /* 裸元素：纯平面，没有底板、没有厚度 */
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(ww, hh), faceMat);
  } else {
    const geo = new THREE.BoxGeometry(ww, hh, 0.06);
    mesh = new THREE.Mesh(geo, [sideMat,sideMat,sideMat,sideMat,faceMat,sideMat]);
  }

  if(lyricMeta){
    const winPx = hh * ppm;                    // 面板可见高度 = 多少像素
    lyricMeta.repeatY = Math.min(1, winPx / ch);
    tex.repeat.set(1, lyricMeta.repeatY);
    tex.offset.set(0, 1 - lyricMeta.repeatY);
  }
  if(listMeta){
    /* 裁剪出「窗口」——与 lyric3d 同一套 offset 机制 */
    tex.repeat.set(1, listMeta.repeatY);
    tex.offset.set(0, 1 - listMeta.repeatY);
  }

  /* ⚠️ 不能用 JSON 深拷贝（2026-09-22）：真实规模下 items 可达 523 条，
     每个控件深拷贝一遍纯属浪费（内存 + 启动时间）。
     改为浅拷贝一层，items 共享只读引用；可变状态（sel/scrollPx）单独放。 */
  const view = listMeta
    ? { scrollPx:0, firstPx:0, winPx:listMeta.winPx, rowH:listMeta.rowH, vel:0 }
    : null;

  mesh.userData = {
    widget: w, idx, w: ww, h: hh, canvas: c, tex, faceMat, sideMat,
    state: Object.assign({}, w, { view }),
    regions: [], hl:0, enterT:0, enterK:0, enterDelay:0,
    phase: Math.random()*Math.PI*2,
    floatDir: new THREE.Vector3(0,1,0),
    lyricMeta, listMeta
  };
  redrawWidget(mesh);
  return mesh;
}

function buildPage(key){
  if(pageByKey[key]) return;
  const page = PAGES[key];
  const list = [];

  /* ---- 自由摆放模式（屏幕比例 sf/sv，或球面 az/el）---- */
  if(page.widgets.some(w => w.az !== undefined || w.sf !== undefined)){
    const R2 = page.radius || 8;
    const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * R2;
    const halfW = halfH * (innerWidth/innerHeight);

    page.widgets.forEach((w, i) => {
      /* 尺寸：优先按「屏幕比例」算，保证各种屏幕观感一致 */
      let ww = w.w || PAGE_W;
      let hh = w.h || widgetHeight(w);
      if(w.fw){
        ww = w.fw * 2 * halfW;
        hh = w.square ? ww : (w.fh ? w.fh * 2 * halfH : hh);
      }
      /* ⚠️ fhSquare（2026-09-22）：正方形元素按【屏高】定边长，而非屏宽。
         原因：封面若按屏宽定（fw+square），在宽屏上会明显变大
         （aspect 0.45→0.60 时高占比 0.108→0.144，+33%），
         挤压下方间隙。改按屏高定 → 各屏幕封面大小恒定、间隙恒定。
         适合「竖排堆叠」的正方形元素（如播放页封面）。 */
      if(w.fhSquare){
        hh = w.fhSquare * 2 * halfH;
        ww = hh;
      }

      const mesh = makeWidgetMesh(w, i, ww, hh);

      let pos;
      if(w.sf !== undefined){
        /* 屏幕比例 → 世界坐标 */
        pos = new THREE.Vector3(
          (w.sf*2 - 1) * halfW,
          (1 - w.sv*2) * halfH,
          -R2
        );
      } else {
        const az = (w.az || 0) * Math.PI/180;
        const el = (w.el || 0) * Math.PI/180;
        pos = new THREE.Vector3(
          Math.cos(el)*Math.sin(az)*R2,
          Math.sin(el)*R2,
          -Math.cos(el)*Math.cos(az)*R2
        );
      }
      mesh.position.copy(pos);
      mesh.userData.home = pos.clone();
      mesh.userData.tilt = w.tilt;      // 有值=固定倾斜（不跟随相机）
      mesh.userData.floatAmp = w.float; // 0=不漂浮（保持间距稳定）
      mesh.visible = false;
      subGroup.add(mesh);
      list.push(mesh);
    });
    pageByKey[key] = list;
    return;
  }

  /* ---- 竖列模式 ---- */
  const gap = 0.55;
  const hs = page.widgets.map(w => widgetHeight(w));
  let total = 0;
  hs.forEach((h,i) => { total += h + (i ? gap : 0); });

  let y = total/2;
  page.widgets.forEach((w, i) => {
    const h = hs[i];
    const cy = y - h/2;
    y -= h + gap;

    const mesh = makeWidgetMesh(w, i);
    mesh.position.set(0, cy, -(PAGE_R + (Math.random()-0.5)*0.5));
    mesh.userData.home = mesh.position.clone();
    mesh.visible = false;
    subGroup.add(mesh);
    list.push(mesh);
  });
  pageByKey[key] = list;
}

function activatePage(key){
  for(const k in pageByKey){
    const on = (k === key);
    pageByKey[k].forEach(m => { m.visible = on; });
  }
  subPanels = pageByKey[key];
}

function makeVinylTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(256,256,20,256,256,256);
  rg.addColorStop(0,'#2B2F35'); rg.addColorStop(.5,'#1B1E23'); rg.addColorStop(1,'#131518');
  g.fillStyle = rg; g.beginPath(); g.arc(256,256,256,0,Math.PI*2); g.fill();

  for(let i=0;i<78;i++){
    const r = 62 + i*2.5;
    g.strokeStyle = 'rgba(255,255,255,' + (0.016 + Math.random()*0.022) + ')';
    g.lineWidth = 1;
    g.beginPath(); g.arc(256,256,r,0,Math.PI*2); g.stroke();
  }
  const hg = g.createLinearGradient(0,0,512,512);
  hg.addColorStop(0,'rgba(255,255,255,0.11)');
  hg.addColorStop(.45,'rgba(255,255,255,0)');
  hg.addColorStop(.56,'rgba(255,255,255,0.055)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  g.globalCompositeOperation = 'overlay';
  g.fillStyle = hg; g.beginPath(); g.arc(256,256,256,0,Math.PI*2); g.fill();
  g.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeLabelTexture(track){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const a = track.accent.split(',').map(Number);
  const c1 = 'rgb(' + Math.min(255,a[0]+34) + ',' + Math.min(255,a[1]+34) + ',' + Math.min(255,a[2]+38) + ')';
  const c2 = 'rgb(' + Math.max(0,a[0]-46) + ',' + Math.max(0,a[1]-44) + ',' + Math.max(0,a[2]-40) + ')';

  const grd = g.createLinearGradient(0,0,512,512);
  grd.addColorStop(0,c1); grd.addColorStop(1,c2);
  g.fillStyle = grd; g.beginPath(); g.arc(256,256,256,0,Math.PI*2); g.fill();

  const rg = g.createRadialGradient(170,160,10,170,160,320);
  rg.addColorStop(0,'rgba(198,204,212,0.18)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(256,256,256,0,Math.PI*2); g.fill();

  g.strokeStyle = 'rgba(255,255,255,0.20)'; g.lineWidth = 3;
  for(let i=0;i<3;i++){
    g.beginPath(); g.arc(256,256,96+i*48, Math.PI*0.12, Math.PI*0.94); g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 2;
  g.beginPath(); g.arc(256,256,236,0,Math.PI*2); g.stroke();

  /* 中心孔 */
  g.fillStyle = 'rgba(9,10,12,0.96)';
  g.beginPath(); g.arc(256,256,20,0,Math.PI*2); g.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function nowWidgets(type){
  const list = pageByKey.now;
  if(!list) return [];
  /* ⚠️ m 是 mesh，控件配置在 m.userData.widget 里 */
  return type ? list.filter(m => m.userData.widget.type === type) : list;
}
function redrawNowType(type){ nowWidgets(type).forEach(m => redrawWidget(m)); }
function redrawNowPage(){ nowWidgets().forEach(m => redrawWidget(m)); }

function lyricTargetOffset(){
  const ly = nowWidgets('lyric3d')[0];
  if(!ly) return 0;
  const meta = ly.userData.lyricMeta;
  const raw = 1 - (meta.top + NP.lyricIdx * meta.lh) / meta.ch - meta.repeatY/2;
  return Math.max(0, Math.min(1 - meta.repeatY, raw));
}
function snapLyrics(){
  const ly = nowWidgets('lyric3d')[0];
  if(ly) ly.userData.tex.offset.y = lyricTargetOffset();
}

function switchTrack(delta){
  NP.idx = (NP.idx + delta + TRACKS.length) % TRACKS.length;
  NP.cur = 0;
  NP.lyricIdx = 0;
  lastSec = -1;
  setPlaying(true);
  redrawNowPage();
  snapLyrics();
  syncMini();
}

function nowTick(dt){
  if(!(mode === 'sub' && curPageKey === 'now')) return;
  const t = track();

  if(NP.playing && !seekDrag){
    NP.cur += dt;
    if(NP.cur >= t.dur){ NP.cur = t.dur; setPlaying(false); }
  }

  /* 当前歌词句变化 → 重画歌词（高亮）*/
  const k = curLyricIndex();
  if(k !== NP.lyricIdx){
    NP.lyricIdx = k;
    redrawNowType('lyric3d');
  }

  /* 歌词平滑滚动 */
  const ly = nowWidgets('lyric3d')[0];
  if(ly){
    const target = lyricTargetOffset();
    ly.userData.tex.offset.y += (target - ly.userData.tex.offset.y) * Math.min(1, dt*4.5);
  }

  /* 每秒刷新一次控制面板（时间 / 进度）*/
  const sec = Math.floor(NP.cur);
  if(sec !== lastSec){
    lastSec = sec;
    redrawNowType('transport');
  }
}

/* 主页：自由环视（不限角度，可以一直转圈）；
   子页面：横向锁死、纵向可浏览（内容是一列）
   ⚠️ 主页 yawMax 必须是 Infinity：
      卡片是环形排列，"当前播放"在 180°，
      若限制 ±π，拖动会卡在 180°（正好是当前播放），
      且索引栏跳转会被夹回同一位置。*/
const CAM = {
  main: { yawMax: Infinity, pitchMax: 1.30, sensX: 0.012, sensY: 0.008 },
  sub:  { yawMax: 0.22,     pitchMax: 0.72, sensX: 0.005, sensY: 0.008 }   /* 2026-09-22 提高灵敏度 */
};

/* 角度归一化：yaw 可无限增长，把它和 curYaw 同时减去相同的 2π 倍数，
   画面完全不变，但数值回到 ±π 附近，避免进子页面时"回卷"转一大圈。*/
function normalizeYaw(){
  const k = Math.round(yaw / (Math.PI*2));
  if(k !== 0){
    yaw    -= k * Math.PI * 2;
    curYaw -= k * Math.PI * 2;
    savedYaw -= k * Math.PI * 2;
  }
}

/* 射线拾取 & 区域命中（3D 空间里的控件交互）*/
function raycastWidget(x,y){
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((x-rect.left)/rect.width)*2-1;
  pointer.y = -((y-rect.top)/rect.height)*2+1;
  scene.updateMatrixWorld(true);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(currentList(), false);
  return hits.length ? hits[0] : null;
}
function hitRegion(hit){
  if(!hit || !hit.uv) return null;
  const u = hit.object.userData;
  const fx = hit.uv.x, fy = 1 - hit.uv.y;
  for(const r of u.regions){
    if(fx >= r.x && fx <= r.x + r.w && fy >= r.y && fy <= r.y + r.h)
      /* ⚠️ fy 必须返回（2026-09-22 修）：导航条 navSeek 需要纵向比例，
         此前只返回 fx → navSeek 收到 undefined → t=NaN → scrollPx=NaN
         → 列表彻底失效（拖动导航条后什么都滚不动）。 */
      return { r, mesh: hit.object, fx, fy };
  }
  return null;
}

function settingSlide(mesh, fx, r){

  /* 同步到 lyric3d 的 pscale（歌词字号）*/
  nowWidgets('lyric3d').forEach(m => {
    m.userData.widget.pscale = 1.7 * (0.75 + t*0.7);
  });
}
function seekTo(mesh, fx, r){
  const ratio = Math.max(0, Math.min(1, (fx - r.x) / r.w));
  NP.cur = ratio * track().dur;
  lastSec = -1;
  redrawNowType('transport');
  redrawNowType('lyric3d');
}

/* ============================================================
   交互
============================================================ */
function onDown(x,y){
  dragging=true; lastX=x; lastY=y; downX=x; downY=y; moved=false;
  seekDrag = false; listDrag = null;
  if(mode === 'sub'){
    const hit = raycastWidget(x,y);
    const g = hitRegion(hit);
    if(g && g.r.kind === 'seek'){
      seekDrag = true;
      seekTo(g.mesh, g.fx, g.r);
      return;
    }
    /* 播放设置滑块（歌词字号）*/
    if(g && g.r.kind === 'pslider'){
      settingDrag = { mesh: hit.object, r: g.r };
      settingSlide(hit.object, g.fx, g.r);
      return;
    }
    /* ⚠️ 长列表滚动（2026-09-22）：
       在列表控件上纵向拖动 = 滚动列表，而不是转相机。
       否则 523 首歌永远看不到第 100 首之后的。
       （列表内部无法塞 DOM，所以走「拖动=滚动」这条路）*/
    if(hit && hit.object.userData.listMeta){
      const u = hit.object.userData;
      const { total, visible } = listRows(u);
      if(total > visible){                 /* 只有内容超出可视区才接管手势 */
        listDrag = { mesh: hit.object, y0: y, px0: u.state.view.scrollPx,
                     vY:0, lastY:y, lastT:Date.now() };   /* 惯性：追踪速度 */
        u.state.view.vel = 0;
        return;
      }
    }
    /* 导航条：按下即按位置跳转，之后可继续拖 */
    if(g && g.r.kind === 'navtrack'){
      navDrag = { mesh: hit.object, target: g.r.target };
      navSeek(hit.object, g.fy, g.r.target);
      return;
    }
  }
}
function onMove(x,y){
  if(!dragging) return;
  if(Math.abs(x-downX)>6 || Math.abs(y-downY)>6) moved=true;

  /* 正在拖动进度条 */
  if(seekDrag){
    const g = hitRegion(raycastWidget(x,y));
    if(g && g.r.kind === 'seek') seekTo(g.mesh, g.fx, g.r);
    lastX=x; lastY=y;
    return;
  }

  /* 正在滚动长列表：手指上移 = 看后面的行 */
  if(listDrag){
    /* 手指上移 dy<0 → 内容上移 → scrollPx 增大 */
    const dy = y - listDrag.y0;
    const target = listDrag.px0 - dy * LIST_PX_PER_SCREEN;
    const mesh = listDrag.mesh;
    const before = mesh.userData.state.view.scrollPx;
    scrollList(mesh, target - before);
    /* ⚠️ 惯性（2026-09-22 用户要求「滑动惯性」）：
       按时间戳算瞬时速度（px/ms），松手后由 animate 继续衰减推进。
       用时间戳而非帧数，避免不同帧率下速度不一致。 */
    const now = Date.now();
    const dtm = Math.max(1, now - listDrag.lastT);
    /* ⚠️ 速度单位 = px/ms（2026-09-22 修正：原先误把每帧位移当速度，量纲错）
       ⚠️ 必须 clamp：若事件间隔极短（<1ms，或同步派发）dv 会爆成上百，
          导致松手后疯狂滑动几百屏。上限 6 px/ms ≈ 6000px/s，已很快。 */
    const dv = (mesh.userData.state.view.scrollPx - before) / dtm;
    listDrag.vY = Math.max(-LIST_MAX_VEL, Math.min(LIST_MAX_VEL,
                    listDrag.vY * 0.6 + dv * 0.4));   /* 平滑，避免抖动 */
    listDrag.lastT = now;
    lastX=x; lastY=y;
    return;
  }

  /* 正在拖播放设置滑块 */
  if(settingDrag){
    const h = hitRegion(raycastWidget(x,y));
    if(h && h.r.kind === 'pslider') settingSlide(settingDrag.mesh, h.fx, settingDrag.r);
    lastX=x; lastY=y;
    return;
  }

  /* 正在拖导航条：按纵向位置直接跳 */
  if(navDrag){
    const h = hitRegion(raycastWidget(x,y));
    if(h && h.r.kind === 'navtrack') navSeek(navDrag.mesh, h.fy, navDrag.target);
    lastX=x; lastY=y;
    return;
  }

  if(!busy){
    const cfg = camCfg();
    yaw   -= (x-lastX)*cfg.sensX;
    pitch -= (y-lastY)*cfg.sensY;
    yaw   = Math.max(-cfg.yawMax, Math.min(cfg.yawMax, yaw));
    pitch = Math.max(-cfg.pitchMax, Math.min(cfg.pitchMax, pitch));
  }
  lastX=x; lastY=y;
}
function onUp(x,y){
  dragging=false;
  seekDrag=false;
  navDrag=null;
  settingDrag=null;
  /* ⚠️ 角度吸附（2026-09-22）：松手后把列表对齐到整行。
     否则会停在半行上，看着像"没对齐"的廉价感。缓动在 animate 里做。*/
  if(listDrag){
    const m = listDrag.mesh, v = m.userData.state.view;
    if(m.userData.listMeta){
      /* ⚠️ 惯性滑动（2026-09-22）：松手时把速度交给 animate 继续推进。
         速度太小（<0.25 px/ms）就不惯性，直接吸附 —— 否则会「滑一下停不住」。 */
      const vel = Math.max(-LIST_MAX_VEL, Math.min(LIST_MAX_VEL, listDrag.vY || 0));
      if(Math.abs(vel) > 0.15){
        v.vel = vel;
        v.snapTo = undefined;              /* 惯性期间不吸附 */
      } else {
        v.vel = 0;
        const { labelPx, rowH } = listRows(m.userData);
        const rel = Math.max(0, v.scrollPx - labelPx);
        v.snapTo = labelPx + Math.round(rel / rowH) * rowH;
      }
    }
    listDrag=null;
  }
  if(!moved) pick(x,y);
}
function pick(x,y){
  if(busy) return;
  const hit = raycastWidget(x,y);
  if(!hit) return;
  if(mode === 'main'){ enterSection(hit.object); return; }
  const g = hitRegion(hit);
  if(g) handleRegion(g.mesh, g.r);
}

/* ⚠️ 关键：手机上 touchend 之后系统还会补发一次合成 mouseup，
   若两者都处理，点击会被执行两次（开关翻转两次=弹回原样）。
   用一个时间戳，在触摸后的一小段时间内忽略所有鼠标事件。*/
let lastTouchTs = 0;
const MOUSE_AFTER_TOUCH = 800;   // ms
function mouseIsSynthetic(){ return (Date.now() - lastTouchTs) < MOUSE_AFTER_TOUCH; }

canvas.addEventListener('touchstart', e=>{
  lastTouchTs = Date.now();
  onDown(e.touches[0].clientX, e.touches[0].clientY);
},{passive:true});
canvas.addEventListener('touchmove', e=>{
  lastTouchTs = Date.now();
  onMove(e.touches[0].clientX, e.touches[0].clientY);
},{passive:true});
canvas.addEventListener('touchend', e=>{
  lastTouchTs = Date.now();
  const t = e.changedTouches[0];
  onUp(t.clientX, t.clientY);
},{passive:true});
canvas.addEventListener('touchcancel', ()=>{ lastTouchTs = Date.now(); dragging = false; },{passive:true});

canvas.addEventListener('mousedown', e=>{ if(mouseIsSynthetic()) return; onDown(e.clientX,e.clientY); });
canvas.addEventListener('mousemove', e=>{ if(mouseIsSynthetic()) return; onMove(e.clientX,e.clientY); });
canvas.addEventListener('mouseup',   e=>{ if(mouseIsSynthetic()) return; onUp(e.clientX,e.clientY); });
canvas.addEventListener('mouseleave', ()=>{ dragging=false; });

/* ============================================================
   控件行为
============================================================ */
let searchMesh = null;

/* 我的歌单：tabs / grid / songrow 三者联动 */
function updateSongList(songs, title){
  const list = pageByKey[curPageKey] || [];
  list.filter(m => m.userData.widget.type === 'songrow').forEach(m => {
    m.userData.widget.label = title;
    /* ⚠️ 浅拷贝（2026-09-22）：523 首深拷贝是纯浪费，items 共享只读引用 */
    m.userData.widget.items = songs;
    m.userData.state.items = songs;
    m.userData.state.sel = -1;
    /* 换歌单 → 滚动位置归零（否则会停在上一个歌单的中间）*/
    if(m.userData.state.view){ m.userData.state.view.scrollPx = 0; m.userData.state.view.firstPx = 0; }
    redrawWidget(m);
  });
}
function syncPlaylistSet(setKey){
  const data = PLAYLIST_DATA[setKey] || [];
  const list = pageByKey[curPageKey] || [];
  const gm = list.find(m => m.userData.widget.type === 'grid');
  if(gm){
    const items = data.map(pl => ({ t:pl.t, sub:pl.sub, g:pl.g, songs:pl.songs }));
    gm.userData.widget.items = items;
    gm.userData.state.items = items;
    gm.userData.state.sel = 0;
    if(gm.userData.state.view){ gm.userData.state.view.scrollPx = 0; gm.userData.state.view.firstPx = 0; }
    redrawWidget(gm);
  }
  if(data[0]) updateSongList(data[0].songs, data[0].t);
}

function handleRegion(mesh, r){
  const u = mesh.userData;
  switch(r.kind){
    case 'searchInput':
    case 'searchGo':
      searchMesh = mesh;
      openSheet();
      break;
    case 'chip':
      u.state.sel = (u.state.sel === r.index) ? -1 : r.index;
      redrawWidget(mesh);
      u.hl = 0.8;
      toast('已选择：' + r.value);
      break;
    case 'row':
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.8;
      toast(r.title + ' · ' + r.sub);
      break;
    case 'tab': {
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.7;
      const setKey = (u.widget.sets || [])[r.index];
      if(setKey) syncPlaylistSet(setKey);
      /* ⚠️ search 空间的类型切换 → 用新类型重搜（2026-09-22，P3）*/
      if(curPageKey === 'search'){
        const sm = (pageByKey.search || []).find(m => m.userData.widget.type === 'search');
        const q = (sm && sm.userData.state.value) || '';
        const type = SEARCH_TYPES[r.index] || 'music';
        if(q) applySearch(q, type);
        else {
          /* 无关键词 → 回到热门搜索 */
          const sr = (pageByKey.search || []).find(m => m.userData.widget.type === 'songrow');
          if(sr){ sr.userData.widget.label = '热门搜索'; rebuildListWindow(sr); }
        }
        toast('搜索类型：' + r.value);
        break;
      }
      toast('已切换：' + r.value);
      break;
    }
    case 'cell': {
      const it = u.state.items[r.index];
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.8;
      /* ⚠️ 点歌单 → 进「歌单详情」（2026-09-22 修）
         此前硬匹配专辑名 —— 但歌单名是用户自取的（2026/Jazz/蛋堡），
         与平台专辑名（君の名は。/收敛水）**零交集**，所以永远不触发。
         正确做法：歌单详情显示这个歌单自己的歌。 */
      if(it && it.songs && it.songs.length){
        gotoSpace('songlist', {
          title: it.t,
          sub: it.n + ' 首 · 本地歌单',
          stats: [{ label:'首', value:String(it.n) }],
          songs: it.songs
        });
        toast('打开歌单：' + it.t + '（' + it.n + ' 首）');
        break;
      }
      if(it && it.songs){
        updateSongList(it.songs, it.t);
        touchRecent(it.t);
        reorderGrid(mesh);
        toast('已打开：' + it.t);
      }
      break;
    }
    case 'song': {
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.7;
      /* ⚠️ search 空间点结果 → 按类型跳转（2026-09-22，P3）*/
      if(curPageKey === 'search'){
        const it = (u.widget.items || [])[r.index];
        if(it && it.kind === 'singer'){
          const art = (REAL.artists || []).find(a => a.t === it.t);
          if(art){
            gotoSpace('artist', {
              title: art.t, sub: art.a,
              stats:[{label:'首',value:String(art.n)},{label:'专辑',value:String(art.alb)}],
              songs: REAL.allSongs.filter(s =>
                (s.a||'').split('、').some(x => x.trim() === art.t))
            });
            break;
          }
        }
        if(it && it.kind === 'album'){
          const alb = (REAL.albums || []).find(a => a.t === it.t);
          if(alb){
            gotoSpace('album', {
              title: alb.t, sub: alb.a,
              stats:[{label:'首',value:String(alb.n)}],
              songs: REAL.allSongs.filter(s => (s.alb||'').trim() === alb.t)
            });
            break;
          }
        }
        if(it && it.kind === 'songlist'){
          const pl = (REAL.playlists || []).find(p => p.t === it.t);
          if(pl){
            gotoSpace('songlist', {
              title: pl.t, sub: pl.n + ' 首 · 本地歌单',
              stats:[{label:'首',value:String(pl.n)}],
              songs: pl.songs
            });
            break;
          }
        }
        if(it){ toast('播放：' + it.t + ' · ' + it.a); break; }
      }
      /* ⚠️ 点歌曲 → 若能匹配真实歌手，进歌手详情（2026-09-22）
         歌曲的 singer 字段（如 'Nujabes'）与 REAL.artists 是同一来源，
         匹配可靠（不像歌单名 vs 专辑名那样零交集）。 */
      const singer = (r.sub || '').split('、')[0].split('/')[0].trim();
      const art = (REAL.artists || []).find(a => a.t === singer);
      if(art){
        gotoSpace('artist', {
          title: art.t, sub: art.a,
          stats: [{ label:'首', value:String(art.n) },
                  { label:'专辑', value:String(art.alb) }],
          songs: REAL.allSongs.filter(s =>
            (s.a || '').split('、').some(x => x.trim() === art.t))
        });
        toast('打开歌手：' + art.t);
        break;
      }
      toast(r.title + ' · ' + r.sub);
      break;
    }
    case 'toggle': {
      const it = u.state.items[r.index];
      it.v = !it.v;
      redrawWidget(mesh);
      u.hl = 0.6;
      toast(it.t + '：' + (it.v ? '已开启' : '已关闭'));
      break;
    }
    case 'play':
      setPlaying(!NP.playing);
      redrawWidget(mesh);
      u.hl = 0.6;
      break;
    case 'prev': switchTrack(-1); break;
    case 'next': switchTrack(1);  break;
    case 'seek': break;   /* 由拖动处理 */

    /* ── P3 播放页扩展（2026-09-22）── */
    case 'pbtn': {          /* 更多按钮行 */
      u.state.sel = (u.state.sel === r.index) ? -1 : r.index;
      redrawWidget(mesh);
      u.hl = 0.7;
      const b = (u.widget.items || [])[r.index];
      if(!b) break;
      if(b.action === 'moreMenu'){
        /* 「更多」→ 提示左转查看菜单（菜单已做成环绕面）*/
        toast('向左转查看更多操作');
      } else if(b.action === 'addTo'){
        toast('添加到歌单');
      } else if(b.action === 'playMode'){
        /* 循环播放模式 */
        const MODES = ['列表循环','单曲循环','随机播放','顺序播放'];
        u.state.mode = ((u.state.mode || 0) + 1) % MODES.length;
        toast('播放模式：' + MODES[u.state.mode]);
      }
      break;
    }
    case 'pmenu': {         /* 更多菜单项 */
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.7;
      const it = (u.widget.items || [])[r.index];
      if(!it) break;
      if(it.action === 'like'){
        it.on = !it.on;
        redrawWidget(mesh);
        toast(it.on ? '已喜欢' : '已取消喜欢');
      } else if(it.action === 'download'){
        toast('开始下载：' + track().title);
      } else if(it.action === 'copyName'){
        toast('已复制歌名');
      } else if(it.action === 'sourceDetail'){
        toast('来源：' + (it.s || '未知'));
      } else {
        toast(it.t);
      }
      break;
    }
    case 'palign': {        /* 歌词对齐三选 */
      u.state.align = r.index;
      redrawWidget(mesh);
      u.hl = 0.6;
      toast('歌词对齐：' + r.value);
      break;
    }
    case 'hact': {          /* 头图卡操作按钮（P2）*/
      u.state.sel = (u.state.sel === r.index) ? -1 : r.index;
      redrawWidget(mesh);
      u.hl = 0.6;
      const a = (u.widget.actions || [])[r.index];
      if(!a) break;
      if(a.action === 'playAll') toast('播放全部：' + u.widget.title);
      else if(a.action === 'like')   toast('已收藏：' + u.widget.title);
      else if(a.action === 'follow') toast('已关注：' + u.widget.title);
      else toast(a.title);
      break;
    }
    case 'pswitch': {       /* 显示控制栏开关 */
      u.state.showCtrl = !(u.state.showCtrl !== undefined ? u.state.showCtrl : true);
      redrawWidget(mesh);
      u.hl = 0.6;
      toast('控制栏：' + (u.state.showCtrl ? '显示' : '隐藏'));
      break;
    }
  }
}

/* ============================================================
   搜索输入面板
============================================================ */
const sheetEl = document.getElementById('sheet');
const sheetInput = document.getElementById('sheetInput');

function openSheet(){
  sheetEl.classList.add('on');
  setTimeout(() => sheetInput.focus(), 260);
}
function closeSheet(){ sheetEl.classList.remove('on'); sheetInput.blur(); }

document.getElementById('sheetGo').addEventListener('click', submitSearch);
sheetInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitSearch(); });
sheetEl.addEventListener('click', e => { if(e.target === sheetEl) closeSheet(); });

function submitSearch(){
  const v = sheetInput.value.trim();
  closeSheet();
  if(!v) return;
  if(searchMesh){
    searchMesh.userData.state.value = v;
    redrawWidget(searchMesh);
    searchMesh.userData.hl = 1;
  }

  /* ⚠️ 若当前在 search 空间 → 本地搜索（2026-09-22，P3）
     4 种类型由 tabs 决定；结果填进 songrow。*/
  if(curPageKey === 'search'){
    const ws = pageByKey.search || [];
    const tabs = ws.find(m => m.userData.widget.type === 'tabs');
    const type = SEARCH_TYPES[(tabs && tabs.userData.state.sel) || 0] || 'music';
    const n = applySearch(v, type);
    toast(n ? ('找到 ' + n + ' 条' + SEARCH_TYPE_CN[type] + '：' + v)
            : ('没有找到「' + v + '」（' + SEARCH_TYPE_CN[type] + '）'));
    return;
  }

  /* 其他空间的列表内搜索（原逻辑）*/
  const lm = (pageByKey[curPageKey] || []).find(
    m => m.userData.listMeta && m.userData.widget.type === 'songrow');
  if(lm){
    const items = lm.userData.widget.items || [];
    const q = v.toLowerCase();
    const hit = items.findIndex(it => (it.t + ' ' + it.a).toLowerCase().includes(q));
    if(hit >= 0){
      scrollListTo(lm, hit);
      lm.userData.state.sel = hit;
      lm.userData.hl = 1;
      redrawWidget(lm);
      toast('已定位：' + items[hit].t + ' · ' + items[hit].a + '（第 ' + (hit+1) + ' 首）');
    } else {
      toast('「' + v + '」没找到（该歌单共 ' + items.length + ' 首）');
    }
    return;
  }
  toast('搜索：' + v);
}


/* ============================================================
   转场
============================================================ */
const wipeEl = document.getElementById('wipe');
const backBtn = document.getElementById('backBtn');
const crumbEn = document.getElementById('crumbEn');
const crumbCn = document.getElementById('crumbCn');

function wipe(on){ wipeEl.classList.toggle('on', on); }

function playEnter(list){
  list.forEach((m,i) => {
    m.userData.enterT = 0;
    m.userData.enterK = 0;
    m.userData.enterDelay = i * 0.055;
  });
}

/* 记住进入子页面前的视角，返回时还原 */
let savedYaw = 0, savedPitch = 0;

function enterSection(mesh){
  if(busy) return;
  busy = true;
  const key = mesh.userData.feature.key;
  document.body.classList.add('busy');

  /* 记录当前视角（先归一化，避免数值过大）*/
  normalizeYaw();
  savedYaw = yaw; savedPitch = pitch;

  flyCard = { mesh, t:0, dur:0.40 };
  setTimeout(() => wipe(true), 300);

  setTimeout(() => {
    mesh.position.copy(mesh.userData.home);
    mesh.scale.set(1,1,1);
    flyCard = null;

    /* ⚠️ 构建失败兜底（2026-09-22）：若 buildPage 抛异常，
       不能停在「主页已隐藏、子空间为空」的黑屏状态 → 回退到主页并提示。 */
    try {
      buildPage(key);
      activatePage(key);
      mainGroup.visible = false;
      subGroup.visible = true;
    } catch(err){
      console.error('[buildPage:' + key + '] 构建失败，回退主页:', err);
      subGroup.visible = false;
      mainGroup.visible = true;
      mode = 'main';
      curPageKey = null;
      busy = false;
      document.body.classList.remove('busy');
      document.body.classList.remove('sub');
      backBtn.classList.remove('on');
      wipe(false);
      toast('「' + key + '」空间构建失败，已返回主页');
      return;
    }

    mode = 'sub';
    curPageKey = key;
    yaw = 0; pitch = 0;

    playEnter(subPanels);
    rebuildIndex(subPanels);

    /* 空间播放器：初始化歌词高亮与滚动位置 */
    if(key === 'now'){
      NP.lyricIdx = curLyricIndex();
      lastSec = -1;
      redrawNowPage();
      snapLyrics();
    }

    crumbEn.textContent = PAGES[key].en;
    crumbCn.textContent = PAGES[key].cn;
    /* ⚠️ 从主页进入 → 重置导航栈（2026-09-22）*/
    spaceStack.length = 0;
    spaceStack.push(key);
    backBtn.textContent = '← 返回主页';
    document.body.classList.add('sub');
    backBtn.classList.add('on');

    wipe(false);
    busy = false;
    document.body.classList.remove('busy');
  }, 470);
}

function exitSection(){
  if(busy || mode !== 'sub') return;
  busy = true;
  document.body.classList.add('busy');
  closeSheet();
  wipe(true);

  setTimeout(() => {
    /* ⚠️ 先弹栈：若栈里还有上级空间，返回上一级；否则回主页（2026-09-22）*/
    spaceStack.pop();                       /* 弹出当前空间 */
    const prev = spaceStack[spaceStack.length - 1];

    if(prev && PAGES[prev]){
      /* ── 返回上一级空间 ── */
      curPageKey = prev;
      activatePage(prev);
      restoreSpaceState(prev);
      subGroup.visible = true;
      mainGroup.visible = false;
      mode = 'sub';

      const p = PAGES[prev];
      crumbEn.textContent = p.en;
      crumbCn.textContent = p.cn;
      backBtn.textContent = spaceStack.length > 1 ? '← 返回上一级' : '← 返回主页';
      document.body.classList.add('sub');
      backBtn.classList.add('on');

      wipe(false);
      busy = false;
      document.body.classList.remove('busy');
      return;
    }

    /* ── 回主页（栈空）── */
    spaceStack.length = 0;
    subGroup.visible = false;
    mainGroup.visible = true;
    mode = 'main';
    curPageKey = null;

    /* 还原进入前的视角（回到原来那张卡片的方向）*/
    yaw = savedYaw; pitch = savedPitch;

    playEnter(mainPanels);
    rebuildIndex(mainPanels);

    backBtn.textContent = '← 返回主页';
    document.body.classList.remove('sub');
    backBtn.classList.remove('on');

    wipe(false);
    busy = false;
    document.body.classList.remove('busy');
  }, 260);
}
backBtn.addEventListener('click', exitSection);

/* ============================================================
   定位 / 索引栏 / 边缘指示
============================================================ */
function lookAtCard(mesh){
  if(busy) return;
  const cfg = camCfg();
  const d = mesh.position.clone().normalize();
  const targetPitch = Math.asin(THREE.MathUtils.clamp(d.y,-1,1));
  let targetYaw = Math.atan2(-d.x, -d.z);
  while(targetYaw - yaw >  Math.PI) targetYaw -= Math.PI*2;
  while(targetYaw - yaw < -Math.PI) targetYaw += Math.PI*2;
  yaw   = THREE.MathUtils.clamp(targetYaw,  -cfg.yawMax,   cfg.yawMax);
  pitch = THREE.MathUtils.clamp(targetPitch,-cfg.pitchMax, cfg.pitchMax);
  mesh.userData.hl = 1;
}

const indexBar = document.getElementById('indexBar');
function rebuildIndex(list){
  indexBar.innerHTML = '';
  list.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = m.userData.feature
      ? m.userData.feature.title
      : (m.userData.widget.label || m.userData.widget.type);
    chip.addEventListener('click', () => lookAtCard(m));
    indexBar.appendChild(chip);
  });
}

const indicators = document.getElementById('indicators');
const indPool = [];
function getInd(i){
  if(!indPool[i]){
    const el = document.createElement('div');
    el.className = 'ind';
    indicators.appendChild(el);
    indPool[i] = el;
  }
  return indPool[i];
}

const _v = new THREE.Vector3();
const _invQ = new THREE.Quaternion();

function updateIndicators(list){
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5));
  const aspect = innerWidth/innerHeight;
  _invQ.copy(camera.quaternion).invert();

  for(let i = 0; i < list.length; i++){
    const el = getInd(i);
    const m = list[i];
    if(!m.visible){ el.style.opacity = 0; continue; }
    _v.copy(m.position).sub(camera.position).applyQuaternion(_invQ);

    let nx, ny, visible;
    if(_v.z < -0.01){
      const d = -_v.z;
      nx = (_v.x/d)/(tanHalf*aspect);
      ny = (_v.y/d)/tanHalf;
      visible = Math.abs(nx) < 0.86 && Math.abs(ny) < 0.86;
    } else {
      const d = Math.max(0.01, _v.z);
      nx = -(_v.x/d)/(tanHalf*aspect);
      ny = -(_v.y/d)/tanHalf;
      visible = false;
    }
    if(visible){ el.style.opacity = 0; continue; }

    let mx = Math.abs(nx), my = Math.abs(ny);
    if(mx < 0.001 && my < 0.001){ nx = 0; ny = -1.5; mx = 0; my = 1.5; }
    const k = 1/Math.max(mx,my);
    const ex = THREE.MathUtils.clamp(nx*k, -0.93, 0.93);
    const ey = THREE.MathUtils.clamp(ny*k, -0.93, 0.93);
    el.style.left = ((ex*0.5+0.5)*100)+'%';
    el.style.top  = ((-ey*0.5+0.5)*100)+'%';
    el.style.transform = 'translate(-50%,-50%) rotate(' + (Math.atan2(ex,ey)*180/Math.PI) + 'deg)';
    el.style.opacity = 1;
  }
  for(let i = list.length; i < indPool.length; i++) indPool[i].style.opacity = 0;
}

/* ============================================================
   动画循环
============================================================ */
const clock = new THREE.Clock();
const _dir = new THREE.Vector3();
const _target = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  curYaw   += (yaw   - curYaw)   * Math.min(1, dt*6);
  curPitch += (pitch - curPitch) * Math.min(1, dt*6);

  camera.position.set(
    Math.sin(t*0.4)*0.12,
    Math.cos(t*0.31)*0.10,
    Math.sin(t*0.11)*0.55
  );
  camera.rotation.order = 'YXZ';
  camera.rotation.y = curYaw;
  camera.rotation.x = curPitch;
  camera.rotation.z = Math.sin(t*0.2)*0.005;

  motes.rotation.y += dt*0.012;
  motes.rotation.x += dt*0.004;

  idleT += dt;
  if(idleT > 6 && !busy) document.body.classList.add('idle');

  const list = currentList();
  for(const m of list){
    if(!m.visible) continue;
    const u = m.userData;

    if(u.enterK < 1){
      u.enterT += dt;
      const k = Math.min(1, Math.max(0, (u.enterT - u.enterDelay)/0.5));
      u.enterK = 1 - Math.pow(1-k, 3);
    }
    const ek = u.enterK;

    if(u.hl > 0.002) u.hl *= Math.pow(0.06, dt); else u.hl = 0;

    /* 漂浮：默认轻微呼吸；float:0 的控件完全不漂（保持间距稳定）*/
    const amp = (u.floatAmp === undefined) ? 0.14 : u.floatAmp;
    const off = Math.sin(t*0.5 + u.phase) * amp * ek;
    m.position.copy(u.home).multiplyScalar(1 + 1.7*(1-ek)).addScaledVector(u.floatDir, off);
    m.scale.setScalar((0.45 + 0.55*ek) * (1 + u.hl*0.16));

    /* 朝向：默认始终正对镜头；标了 tilt 的则「固定倾斜」不跟随相机 */
    if(u.tilt === undefined){
      m.lookAt(camera.position);
    } else {
      const baseYaw = Math.atan2(-m.position.x, -m.position.z);
      m.rotation.order = 'YXZ';
      m.rotation.set(0, baseYaw + u.tilt, 0);
    }

    const dist = camera.position.distanceTo(m.position);
    const dof = THREE.MathUtils.clamp(1 - (dist-6)/40, 0.72, 1);   /* 2026-09-22 减轻景深变暗 */
    const isFly = (flyCard && flyCard.mesh === m);
    const targetOp = isFly ? 1 : (busy ? 0 : dof*ek);
    u.faceMat.opacity += (targetOp - u.faceMat.opacity) * Math.min(1, dt*9);
    u.sideMat.opacity = u.faceMat.opacity;
    if(u.halo) u.halo.material.opacity = u.faceMat.opacity * (0.30 + u.hl*1.5);
  }

  if(flyCard){
    flyCard.t += dt;
    const k = Math.min(1, flyCard.t/flyCard.dur);
    const e = k*k;
    _dir.set(0,0,-1).applyQuaternion(camera.quaternion);
    _target.copy(camera.position).addScaledVector(_dir, 9 - 7.5*e);
    flyCard.mesh.position.copy(_target);
    flyCard.mesh.scale.setScalar(1 + e*8);
    flyCard.mesh.lookAt(camera.position);
    const fu = flyCard.mesh.userData;
    if(fu.faceMat) fu.faceMat.opacity = 1;
    if(fu.sideMat) fu.sideMat.opacity = 1;
    if(fu.halo)    fu.halo.material.opacity = 0.3;
  }

  /* 空间播放器：推进播放 / 歌词滚动 */
  nowTick(dt);

  /* 列表惯性 + 吸附（松手后先惯性滑行，停下再对齐整行）*/
  tickListInertia(dt);
  tickListSnap(dt);

  updateIndicators(list);
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 启动 ---------------- */
rebuildIndex(mainPanels);
playEnter(mainPanels);
animate();

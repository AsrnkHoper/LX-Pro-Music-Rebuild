/* ---------------- 配色 ---------------- */
const PALETTES = [
  ['#3A3D43','#1D1F23'], ['#3C3F45','#202226'], ['#353A41','#1B1D21'],
  ['#43464C','#23252A'], ['#393E46','#1E2024'], ['#3F4248','#212327']
];

/* ---------------- 绘图工具 ---------------- */
function roundRect(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function drawPanelBg(g, W, H, i){
  const [a,b] = PALETTES[i % PALETTES.length];
  const r = Math.min(H*0.10, 0.30*(W/5));
  const grd = g.createLinearGradient(0,0,W*0.9,H);
  grd.addColorStop(0,a); grd.addColorStop(1,b);
  g.fillStyle = grd; roundRect(g,0,0,W,H,r); g.fill();

  const sg = g.createLinearGradient(0,H,0,H*0.35);
  sg.addColorStop(0,'rgba(38,72,94,0.20)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = sg; roundRect(g,0,0,W,H,r); g.fill();

  const hg = g.createRadialGradient(W*0.88,H*0.10,4,W*0.88,H*0.10,W*0.75);
  hg.addColorStop(0,'rgba(198,204,212,0.09)'); hg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = hg; roundRect(g,0,0,W,H,r); g.fill();

  g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 2;
  roundRect(g,1,1,W-2,H-2,r); g.stroke();
}
function hairline(g, x1,y,x2, alpha){
  g.strokeStyle = 'rgba(255,255,255,' + (alpha||0.06) + ')';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(x1,y); g.lineTo(x2,y); g.stroke();
}
function label(g, text, x, y, P, alpha){
  /* ⚠️ 提亮 + 放大（2026-09-22 用户反馈「灰色字看不清」）：
     原 rgba(152,160,172,0.78) / 0.23P → 现更亮更大 */
  g.fillStyle = 'rgba(186,196,212,' + (alpha||0.92) + ')';
  g.font = '500 ' + Math.round(0.28*P) + 'px ' + FONT;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillText(text, x, y);
}
function arrow(g, x, y, s, alpha){
  g.strokeStyle = 'rgba(160,170,184,' + (alpha||0.55) + ')';
  g.lineWidth = Math.max(1.5, s*0.16);
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(x-s*0.35, y-s*0.45); g.lineTo(x+s*0.35, y); g.lineTo(x-s*0.35, y+s*0.45);
  g.stroke();
}
/* 排版基准：控件可用 pscale 放大内容（文字/按钮），面板尺寸不变 */
function wp(W, w){ return (W/5) * (w && w.pscale ? w.pscale : 1); }

/* ---------------- 控件绘制（返回可点击区域）---------------- */
const DRAW = {

  /* 搜索栏：输入框 + 搜索按钮 */
  search(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.28*P;
    const boxH = H - 2*pad;
    const btnR = boxH*0.5;
    const boxW = W - 2*pad - boxH - 0.22*P;

    g.fillStyle = 'rgba(255,255,255,0.055)';
    roundRect(g, pad, pad, boxW, boxH, boxH*0.32); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1.5;
    roundRect(g, pad, pad, boxW, boxH, boxH*0.32); g.stroke();

    const icx = pad + boxH*0.52, icy = H/2, ir = boxH*0.16;
    g.strokeStyle = 'rgba(198,208,222,0.7)';
    g.lineWidth = Math.max(1.5, 0.032*P); g.lineCap='round';
    g.beginPath(); g.arc(icx, icy, ir, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(icx+ir*0.72, icy+ir*0.72); g.lineTo(icx+ir*1.7, icy+ir*1.7); g.stroke();

    g.textAlign = 'left'; g.textBaseline = 'middle';
    if(st.value){
      g.fillStyle = 'rgba(238,242,248,0.96)';
      g.font = '400 ' + Math.round(0.30*P) + 'px ' + FONT;
      g.fillText(st.value, pad + boxH*0.95, H/2 + 1);
    } else {
      g.fillStyle = 'rgba(146,154,168,0.7)';
      g.font = '400 ' + Math.round(0.28*P) + 'px ' + FONT;
      g.fillText(w.placeholder || '搜索歌曲 · 歌手 · 专辑', pad + boxH*0.95, H/2 + 1);
    }

    const bx = W - pad - btnR, by = H/2;
    g.fillStyle = 'rgba(255,255,255,0.085)';
    g.beginPath(); g.arc(bx, by, btnR, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(bx, by, btnR, 0, Math.PI*2); g.stroke();
    g.strokeStyle = 'rgba(238,242,248,0.9)';
    g.lineWidth = Math.max(1.5, 0.042*P); g.lineCap='round'; g.lineJoin='round';
    g.beginPath(); g.moveTo(bx-0.11*P, by); g.lineTo(bx+0.10*P, by); g.stroke();
    g.beginPath(); g.moveTo(bx+0.03*P, by-0.07*P); g.lineTo(bx+0.10*P, by); g.lineTo(bx+0.03*P, by+0.07*P); g.stroke();

    R.push({ x:pad/W, y:pad/H, w:boxW/W, h:boxH/H, kind:'searchInput' });
    R.push({ x:(bx-btnR)/W, y:(by-btnR)/H, w:2*btnR/W, h:2*btnR/H, kind:'searchGo' });
    return R;
  },

  /* 标签组 */
  chips(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.28*P;
    let y = 0.34*P;
    if(w.label){ label(g, w.label, pad, y + 0.14*P, P); y += 0.46*P; }

    const chipH = 0.54*P;
    let cx = pad;
    g.font = '400 ' + Math.round(0.26*P) + 'px ' + FONT;
    g.textBaseline = 'middle';
    w.items.forEach((t, i) => {
      const tw = g.measureText(t).width;
      const cw = tw + 0.52*P;
      if(cx + cw > W - pad){ cx = pad; y += chipH + 0.18*P; }
      const sel = (st.sel === i);
      g.fillStyle = sel ? 'rgba(50,90,150,0.36)' : 'rgba(255,255,255,0.05)';
      roundRect(g, cx, y, cw, chipH, chipH*0.5); g.fill();
      g.strokeStyle = sel ? 'rgba(184,200,220,0.5)' : 'rgba(255,255,255,0.09)';
      g.lineWidth = 1.5;
      roundRect(g, cx, y, cw, chipH, chipH*0.5); g.stroke();
      g.fillStyle = sel ? 'rgba(242,246,252,0.96)' : 'rgba(202,210,222,0.85)';
      g.textAlign = 'center';
      g.fillText(t, cx + cw/2, y + chipH/2 + 1);
      g.textAlign = 'left';
      R.push({ x:cx/W, y:y/H, w:cw/W, h:chipH/H, kind:'chip', index:i, value:t });
      cx += cw + 0.18*P;
    });
    return R;
  },

  /* 列表 */
  list(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.28*P;
    const items = w.items || [];
    const n = items.length;
    const rowH = 0.85*P;

    /* ⚠️ 像素模型（2026-09-22）：与 songrow/bars 同一套窗口化虚拟滚动 */
    const firstPx = w.__firstPx || 0;
    const labelH = w.label ? 0.64*P : 0;
    const first = Math.max(0, Math.floor((firstPx - labelH) / rowH));
    const last  = Math.min(n, first + Math.ceil(H/rowH) + 2*LIST_BUF + 2);

    if(w.label && labelH > 0 && firstPx < labelH){
      label(g, w.label + (n > 5 ? '  ·  ' + n + ' 条' : ''), pad, 0.48*P - firstPx, P);
    }

    for(let i = first; i < last; i++){
      const it = items[i];
      if(!it) continue;
      const ry = labelH + i*rowH - firstPx;
      if(st.sel === i){
        g.fillStyle = 'rgba(255,255,255,0.05)';
        roundRect(g, pad*0.5, ry+0.05*P, W-pad, rowH-0.1*P, 0.14*P); g.fill();
      }
      const th = rowH*0.54;
      g.fillStyle = 'rgba(255,255,255,0.09)';
      roundRect(g, pad, ry + rowH*0.23, th, th, 0.11*P); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = 1;
      roundRect(g, pad, ry + rowH*0.23, th, th, 0.11*P); g.stroke();

      g.textAlign='left'; g.textBaseline='alphabetic';
      g.fillStyle = 'rgba(236,240,246,0.95)';
      g.font = '500 ' + Math.round(0.27*P) + 'px ' + FONT;
      g.fillText(it.t, pad + th + 0.26*P, ry + rowH*0.50);
      g.fillStyle = 'rgba(178,188,204,0.86)';
      g.font = '400 ' + Math.round(0.21*P) + 'px ' + FONT;
      g.fillText(it.s, pad + th + 0.26*P, ry + rowH*0.78);

      arrow(g, W - pad - 0.14*P, ry + rowH*0.5, 0.22*P, 0.45);
      if(i < n-1) hairline(g, pad + th + 0.26*P, ry+rowH, W-pad, 0.055);

      R.push({ x:0, y:ry/H, w:1, h:rowH/H, kind:'row', index:i, title:it.t, sub:it.s });
    }
    return R;
  },

  /* 分段切换（tabs）：分类 / 热门 / 最新 */
  tabs(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.24*P;
    const gap = 0.12*P;
    const n = w.items.length;
    const tabW = (W - 2*pad) / n;
    const tabH = H - 2*pad;
    w.items.forEach((t, i) => {
      const tx = pad + i*tabW;
      const sel = (st.sel === i);
      if(sel){
        g.fillStyle = 'rgba(255,255,255,0.075)';
        roundRect(g, tx + gap*0.5, pad, tabW - gap, tabH, tabH*0.5); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 1.5;
        roundRect(g, tx + gap*0.5, pad, tabW - gap, tabH, tabH*0.5); g.stroke();
      }
      g.fillStyle = sel ? 'rgba(240,244,250,0.96)' : 'rgba(154,162,176,0.78)';
      g.font = (sel ? '500 ' : '400 ') + Math.round(0.27*P) + 'px ' + FONT;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(t, tx + tabW/2, H/2 + 1);
      R.push({ x:tx/W, y:pad/H, w:tabW/W, h:tabH/H, kind:'tab', index:i, value:t });
    });
    return R;
  },

  /* 封面网格（歌单）：2 列封面 + 名字 + 副信息 */
  /* 封面网格（grid）—— 窗口化虚拟列表（40+ 歌单场景）
     与 songrow 同理：只画可见窗口，滚动改 offset。 */
  grid(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.30*P;
    const cols = 2, gap = 0.26*P;
    const cw = (W - 2*pad - (cols-1)*gap) / cols;
    const artH = cw * 0.74;
    const rowH = artH + 1.06*P;   /* 行高 +18%（字号放大）*/
    const items = w.items || [];
    const n = items.length;
    const totalRows = Math.ceil(n / cols);
    const v = st.view || (st.view = { start:0, count:Math.max(1, Math.floor(H/rowH)) });

    /* 像素模型（2026-09-22），同 songrow */
    const firstPx = w.__firstPx || 0;
    const labelH = w.label ? 0.74*P : 0;
    const firstRow = Math.max(0, Math.floor((firstPx - labelH) / rowH));
    const lastRow  = Math.min(totalRows, firstRow + Math.ceil(H/rowH) + 2*LIST_BUF + 2);

    for(let r = firstRow; r < lastRow; r++){
      for(let c = 0; c < cols; c++){
        const i = r*cols + c;
        if(i >= n) break;
        const it = items[i];
        const cx = pad + c * (cw + gap);
        const cy = labelH + r*rowH - firstPx;
        const sel = (st.sel === i);

        const cc = it.g || ['#3E4E58','#242C32'];
        const grd = g.createLinearGradient(cx, cy, cx+cw, cy+artH);
        grd.addColorStop(0, cc[0]); grd.addColorStop(1, cc[1]);
        g.fillStyle = grd;
        roundRect(g, cx, cy, cw, artH, 0.15*P); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1.5;
        roundRect(g, cx, cy, cw, artH, 0.15*P); g.stroke();

        g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 1.5;
        g.beginPath(); g.arc(cx+cw/2, cy+artH/2, artH*0.32, 0, Math.PI*2); g.stroke();
        g.fillStyle = 'rgba(244,248,252,0.22)';
        g.font = '600 ' + Math.round(0.66*P) + 'px ' + FONT;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(it.t[0], cx + cw/2, cy + artH/2 + 1);

        if(sel){
          g.strokeStyle = 'rgba(198,214,232,0.55)'; g.lineWidth = 2;
          roundRect(g, cx-1, cy-1, cw+2, artH+2, 0.16*P); g.stroke();
        }

        g.textAlign = 'left'; g.textBaseline = 'alphabetic';
        g.fillStyle = sel ? 'rgba(248,251,255,1)' : 'rgba(240,244,250,0.98)';
        g.font = '600 ' + Math.round(0.30*P) + 'px ' + FONT;
        g.fillText(it.t, cx + 0.05*P, cy + artH + 0.42*P, cw - 0.1*P);
        g.fillStyle = 'rgba(178,188,204,0.90)';
        g.font = '400 ' + Math.round(0.24*P) + 'px ' + FONT;
        g.fillText(it.sub, cx + 0.05*P, cy + artH + 0.76*P, cw - 0.1*P);

        R.push({ x:cx/W, y:cy/H, w:cw/W, h:(artH+0.90*P)/H, kind:'cell', index:i, title:it.t });
      }
    }

    /* 标题（内容首段，随滚动上移）——与 songrow 统一 */
    if(w.label && labelH > 0 && firstPx < labelH){
      label(g, w.label + (n ? '  ·  ' + n + ' 个' : ''), pad, 0.52*P - firstPx, P);
    }
    return R;
  },

  /* 歌曲行列表（songrow）：序号 + 歌名 + 歌手 + 时长 */
  /* 歌曲行列表（songrow）—— 窗口化虚拟列表
     ⚠️ 真实规模可达数百首，绝不能整列画进贴图（会撞 canvas 16384px 上限）。
     只画「可见窗口 + 缓冲」，滚动 = 改 tex.offset.y（GPU 侧），
     滚出缓冲才重画窗口。内存与总曲目数无关。 */
  songrow(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.26*P;
    const rowH = 0.96*P;          /* 行高 +23%（2026-09-22：字号放大后行距要跟上）*/
    const items = w.items || [];
    const n = items.length;
    const v = st.view || (st.view = { start:0, count:Math.max(1, Math.floor(H/rowH)) });

    /* 像素模型（2026-09-22）：贴图起点 = __firstPx（内容坐标）
       标题作为「第 0 段内容」参与滚动（标准列表行为）*/
    const firstPx = w.__firstPx || 0;
    const labelH = w.label ? 0.90*P : 0;
    /* 贴图首行对应的内容像素 = firstPx；行 i 的内容像素 = labelH + i*rowH */
    const first = Math.max(0, Math.floor((firstPx - labelH) / rowH));
    const last  = Math.min(n, first + Math.ceil(H/rowH) + 2*LIST_BUF + 2);

    const numW = n >= 100 ? 4 : 2;

    /* 标题（作为内容首段，会随滚动上移）*/
    if(w.label && labelH > 0 && firstPx < labelH){
      label(g, w.label + (n ? '  ·  ' + n + ' 首' : ''), pad, 0.52*P - firstPx, P);
    }

    for(let i = first; i < last; i++){
      const it = items[i];
      if(!it) continue;
      const ry = labelH + i*rowH - firstPx;

      if(st.sel === i){
        g.fillStyle = 'rgba(255,255,255,0.06)';
        roundRect(g, pad*0.35, ry+0.04*P, W-pad*0.7, rowH-0.08*P, 0.12*P); g.fill();
      }

      g.textAlign = 'left'; g.textBaseline = 'middle';
      /* ⚠️ 字号/亮度（2026-09-22 用户反馈「灰色字看不清」）
         此处曾被遗漏（只改了 grid），现补齐：序号 0.19→0.24 且提亮。 */
      /* 序号 */
      g.fillStyle = 'rgba(158,170,186,0.92)';
      g.font = '500 ' + Math.round(0.24*P) + 'px ' + FONT;
      g.fillText(String(i+1).padStart(numW,'0'), pad, ry + rowH/2);

      /* 歌名（自适应，给徽章留位）*/
      const tx = pad + 0.72*P;
      g.fillStyle = 'rgba(244,247,252,1)';
      g.font = '600 ' + Math.round(0.30*P) + 'px ' + FONT;
      const nameMaxW = W - tx - 2.55*P - (it.src ? 0.72*P : 0);
      const nw = g.measureText(it.t).width;
      if(nw > nameMaxW) g.font = '600 ' + Math.round(0.30*P * nameMaxW / nw) + 'px ' + FONT;
      g.fillText(it.t, tx, ry + rowH/2, nameMaxW);

      /* ⚠️ 音源徽章（2026-09-22，移植 LX-Pro ListItem.tsx:127-130）
         LX-Pro 的徽章 = 音源 + 音质 + VIP + cover；
         本原型只有音源数据可靠，故只做音源徽章。 */
      if(it.src){
        const nw2 = g.measureText(it.t).width;
        const bx = Math.min(tx + nw2 + 0.14*P, W - 2.50*P);
        const bw = 0.60*P, bh = 0.28*P, by = ry + rowH/2 - bh/2;
        g.fillStyle = 'rgba(255,255,255,0.09)';
        roundRect(g, bx, by, bw, bh, bh*0.34); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1;
        roundRect(g, bx, by, bw, bh, bh*0.34); g.stroke();
        g.fillStyle = 'rgba(186,200,220,0.94)';
        g.font = '500 ' + Math.round(0.18*P) + 'px ' + FONT;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(it.src, bx + bw/2, by + bh/2 + 1);
        g.textAlign = 'left'; g.textBaseline = 'middle';
      }

      /* 歌手 */
      g.textAlign = 'right';
      g.fillStyle = 'rgba(178,188,204,0.92)';
      g.font = '400 ' + Math.round(0.24*P) + 'px ' + FONT;
      g.fillText(it.a, W - pad - 0.72*P, ry + rowH/2, 1.55*P);

      /* 时长（同样提亮放大）*/
      g.fillStyle = 'rgba(178,188,204,0.92)';
      g.font = '500 ' + Math.round(0.24*P) + 'px ' + FONT;
      g.fillText(it.d, W - pad, ry + rowH/2);

      if(i < n-1) hairline(g, pad, ry+rowH, W-pad, 0.05);

      /* ⚠️ 区域坐标用「窗口内相对位置」，滚动时不需重算全部区域 */
      R.push({ x:0, y:ry/H, w:1, h:rowH/H, kind:'song',
               index:i, title:it.t, sub:it.a });
    }

    return R;
  },

  /* 列表导航条（长列表快速定位）
     ⚠️ 解决「几百首里找不到目标」的核心痛点（2026-09-22）：
        · 显示「当前视窗 / 总数」，给出位置感
        · 拖滑块 = 跳到任意位置（不用一屏屏转）
        · 点顶部/底部 = 回开头 / 去结尾
     通过 w.target 关联到同空间里的某个列表控件（按 type 匹配）。*/
  listnav(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.14*P;
    const trackW = Math.max(3, 0.10*P);
    const tx = W/2 - trackW/2;
    const ty0 = pad, ty1 = H - pad;
    const trackH = ty1 - ty0;

    const t = listNavTarget(w);
    const total = t.total || 0;
    const visible = t.visible || 1;
    /* ⚠️ 像素模型（2026-09-22 修）：maxScroll 来自 listNavTarget 的 maxScroll 字段。
       此前清理重复声明时误删，导致 listnav 一绘制就 ReferenceError
       → buildPage 中断 → 主页已隐藏而子空间未显示 → 黑屏（只剩边缘箭头）。 */
    const maxScroll = t.maxScroll || 0;
    const ratio = maxScroll > 0 ? (t.scroll / maxScroll) : 0;
    const visRatio = total > 0 ? Math.min(1, visible / total) : 1;

    /* 轨道 */
    g.fillStyle = 'rgba(255,255,255,0.09)';
    roundRect(g, tx, ty0, trackW, trackH, trackW/2); g.fill();

    /* 滑块（高度 = 可见比例，位置 = 滚动比例）*/
    const kh = Math.max(0.34*P, trackH * visRatio);
    const ky = ty0 + (trackH - kh) * ratio;
    g.fillStyle = 'rgba(198,214,232,0.80)';
    roundRect(g, tx - 0.025*P, ky, trackW + 0.05*P, kh, trackW/2); g.fill();
    g.strokeStyle = 'rgba(226,238,250,0.45)'; g.lineWidth = 1.2;
    roundRect(g, tx - 0.025*P, ky, trackW + 0.05*P, kh, trackW/2); g.stroke();

    /* 位置数字：当前第几 / 共几 */
    if(total > 0){
      const first = Math.floor(t.scroll) + 1;
      const lastN = Math.min(total, Math.floor(t.scroll) + visible);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(240,246,254,0.98)';
      g.font = '600 ' + Math.round(0.21*P) + 'px ' + FONT;
      g.fillText(first + '-' + lastN, W/2, ty0 - 0.20*P > 0 ? ty0 - 0.20*P : 0.10*P);
      g.fillStyle = 'rgba(178,188,204,0.92)';
      g.font = '400 ' + Math.round(0.17*P) + 'px ' + FONT;
      g.fillText('共 ' + total, W/2, ty1 + 0.20*P);
    }

    /* 整条轨道可点/可拖 */
    R.push({ x:0, y:0, w:1, h:1, kind:'navtrack', target:w.target });
    return R;
  },

  /* 统计大数 */
  stat(g, W, H, w, st, idx){
    const P = W/5;
    const pad = 0.32*P;
    g.textAlign='left'; g.textBaseline='alphabetic';

    g.fillStyle = 'rgba(243,247,252,0.96)';
    g.font = '600 ' + Math.round(0.80*P) + 'px ' + FONT;
    g.fillText(w.value, pad, 1.02*P);
    const vw = g.measureText(w.value).width;

    g.fillStyle = 'rgba(168,178,192,0.85)';
    g.font = '400 ' + Math.round(0.26*P) + 'px ' + FONT;
    g.fillText(w.unit, pad + vw + 0.14*P, 0.98*P);

    label(g, w.label, pad, 1.40*P, P, 0.75);

    if(w.bars){
      const n = w.bars.length;
      const bw = (W - 2*pad) / n;
      const base = H - 0.26*P;
      const maxH = 0.42*P;
      w.bars.forEach((v,i) => {
        const bh = Math.max(2, maxH*v);
        const bx = pad + i*bw;
        const last = (i === n-1);
        g.fillStyle = last ? 'rgba(198,214,232,0.85)' : 'rgba(255,255,255,0.16)';
        roundRect(g, bx, base-bh, bw*0.5, bh, bw*0.25); g.fill();
      });
    }
    return [];
  },

  /* 横向排行条 */
  bars(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.32*P;
    const items = w.items || [];
    const n = items.length;
    const rowH = 0.72*P;

    /* ⚠️ 像素模型（2026-09-22）：与 songrow 同一套窗口化虚拟滚动。
       此前是静态绘制 —— 条数多时被裁切且无法翻动。 */
    const firstPx = w.__firstPx || 0;
    const labelH = w.label ? 0.68*P : 0;
    const first = Math.max(0, Math.floor((firstPx - labelH) / rowH));
    const last  = Math.min(n, first + Math.ceil(H/rowH) + 2*LIST_BUF + 2);

    /* 标题（内容首段，随滚动上移）*/
    if(w.label && labelH > 0 && firstPx < labelH){
      label(g, w.label + (n > 4 ? '  ·  ' + n + ' 条' : ''), pad, 0.48*P - firstPx, P);
    }

    for(let i = first; i < last; i++){
      const it = items[i];
      if(!it) continue;
      const ry = labelH + i*rowH - firstPx;

      g.textAlign='left'; g.textBaseline='alphabetic';
      g.fillStyle = 'rgba(228,234,242,0.92)';
      g.font = '400 ' + Math.round(0.24*P) + 'px ' + FONT;
      g.fillText(it.t, pad, ry + 0.28*P);

      if(it.s){
        g.fillStyle = 'rgba(178,188,204,0.88)';
        g.font = '400 ' + Math.round(0.20*P) + 'px ' + FONT;
        g.textAlign = 'right';
        g.fillText(it.s, W - pad, ry + 0.28*P);
        g.textAlign = 'left';
      }
      const by = ry + 0.42*P, bh = 0.09*P;
      g.fillStyle = 'rgba(255,255,255,0.07)';
      roundRect(g, pad, by, W-2*pad, bh, bh*0.5); g.fill();
      g.fillStyle = 'rgba(178,196,216,0.78)';
      roundRect(g, pad, by, (W-2*pad)*it.v, bh, bh*0.5); g.fill();

      R.push({ x:0, y:ry/H, w:1, h:rowH/H, kind:'bar',
               index:i, title:it.t, sub:it.s });
    }
    return R;
  },

  /* 开关列表 */
  toggle(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.32*P;
    const items = w.items || [];
    const n = items.length;
    const rowH = 0.82*P;

    /* ⚠️ 像素模型（2026-09-22）：设置页每区 6~10 项，静态绘制会被裁切且无法翻动 */
    const firstPx = w.__firstPx || 0;
    const labelH = w.label ? 0.68*P : 0;
    const first = Math.max(0, Math.floor((firstPx - labelH) / rowH));
    const last  = Math.min(n, first + Math.ceil(H/rowH) + 2*LIST_BUF + 2);

    if(w.label && labelH > 0 && firstPx < labelH){
      label(g, w.label + (n > 5 ? '  ·  ' + n + ' 项' : ''), pad, 0.48*P - firstPx, P);
    }

    for(let i = first; i < last; i++){
      const it = items[i];
      if(!it) continue;
      const ry = labelH + i*rowH - firstPx;
      g.textAlign='left'; g.textBaseline='alphabetic';
      g.fillStyle = 'rgba(236,240,246,0.95)';
      g.font = '500 ' + Math.round(0.26*P) + 'px ' + FONT;
      g.fillText(it.t, pad, ry + rowH*0.62, W - 2*pad - 1.10*P);

      const sw = 0.94*P, sh = 0.54*P;
      const sx = W - pad - sw, sy = ry + rowH*0.5 - sh/2;
      /* ⚠️ 状态从 state.items 读（handleRegion 改的是它），带兜底 */
      const stIt = (st.items && st.items[i]) || it;
      const on = !!stIt.v;

      g.fillStyle = on ? 'rgba(154,176,200,0.85)' : 'rgba(255,255,255,0.11)';
      roundRect(g, sx, sy, sw, sh, sh*0.5); g.fill();
      if(on){
        g.strokeStyle = 'rgba(200,216,236,0.35)'; g.lineWidth = 1.5;
        roundRect(g, sx, sy, sw, sh, sh*0.5); g.stroke();
      }
      const kr = sh*0.36;
      const kx = on ? (sx + sw - sh*0.5) : (sx + sh*0.5);
      g.fillStyle = on ? 'rgba(18,20,24,0.92)' : 'rgba(196,204,216,0.8)';
      g.beginPath(); g.arc(kx, sy + sh/2, kr, 0, Math.PI*2); g.fill();

      if(i < n-1) hairline(g, pad, ry+rowH, W-pad, 0.05);

      R.push({ x:(sx-0.12*P)/W, y:(sy-0.1*P)/H, w:(sw+0.24*P)/W, h:(sh+0.2*P)/H,
               kind:'toggle', index:i, title:it.t });
    }
    return R;
  },

  /* 正在播放 */
  now(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.32*P;
    const art = 1.20*P;

    g.fillStyle = 'rgba(255,255,255,0.07)';
    roundRect(g, pad, 0.36*P, art, art, 0.20*P); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1.5;
    roundRect(g, pad, 0.36*P, art, art, 0.20*P); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(pad+art/2, 0.36*P+art/2, art*0.30, 0, Math.PI*2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.10)';
    g.beginPath(); g.arc(pad+art/2, 0.36*P+art/2, art*0.10, 0, Math.PI*2); g.fill();

    const tx = pad + art + 0.34*P;
    g.textAlign='left'; g.textBaseline='alphabetic';
    g.fillStyle = 'rgba(242,246,252,0.96)';
    g.font = '500 ' + Math.round(0.34*P) + 'px ' + FONT;
    g.fillText(w.title, tx, 0.92*P);
    g.fillStyle = 'rgba(150,158,170,0.82)';
    g.font = '400 ' + Math.round(0.23*P) + 'px ' + FONT;
    g.fillText(w.artist, tx, 1.24*P);

    const py = 0.36*P + art + 0.34*P, ph = 0.08*P;
    g.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(g, pad, py, W-2*pad, ph, ph*0.5); g.fill();
    g.fillStyle = 'rgba(198,214,232,0.88)';
    roundRect(g, pad, py, (W-2*pad)*w.progress, ph, ph*0.5); g.fill();
    g.beginPath(); g.arc(pad + (W-2*pad)*w.progress, py+ph/2, ph*0.95, 0, Math.PI*2);
    g.fillStyle = 'rgba(226,238,250,0.95)'; g.fill();

    const cy = py + 0.40*P, cx0 = W/2, gap = 0.86*P;
    g.strokeStyle = 'rgba(230,238,248,0.85)';
    g.lineWidth = Math.max(1.5, 0.04*P); g.lineCap='round';
    g.beginPath(); g.moveTo(cx0-gap-0.09*P, cy-0.11*P); g.lineTo(cx0-gap-0.09*P, cy+0.11*P); g.stroke();
    g.beginPath(); g.moveTo(cx0-gap+0.09*P, cy); g.lineTo(cx0-gap-0.08*P, cy-0.11*P); g.lineTo(cx0-gap-0.08*P, cy+0.11*P); g.closePath();
    g.fillStyle='rgba(230,238,248,0.85)'; g.fill();

    g.fillStyle = 'rgba(255,255,255,0.10)';
    g.beginPath(); g.arc(cx0, cy, 0.30*P, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth=1.5;
    g.beginPath(); g.arc(cx0, cy, 0.30*P, 0, Math.PI*2); g.stroke();
    g.fillStyle = 'rgba(242,248,255,0.95)';
    if(st.playing){
      g.beginPath(); g.moveTo(cx0-0.07*P, cy-0.13*P); g.lineTo(cx0+0.13*P, cy); g.lineTo(cx0-0.07*P, cy+0.13*P); g.closePath(); g.fill();
    } else {
      roundRect(g, cx0-0.12*P, cy-0.13*P, 0.08*P, 0.26*P, 0.02*P); g.fill();
      roundRect(g, cx0+0.04*P, cy-0.13*P, 0.08*P, 0.26*P, 0.02*P); g.fill();
    }
    g.strokeStyle = 'rgba(230,238,248,0.85)';
    g.beginPath(); g.moveTo(cx0+gap+0.09*P, cy-0.11*P); g.lineTo(cx0+gap+0.09*P, cy+0.11*P); g.stroke();
    g.beginPath(); g.moveTo(cx0+gap-0.09*P, cy); g.lineTo(cx0+gap+0.08*P, cy-0.11*P); g.lineTo(cx0+gap+0.08*P, cy+0.11*P); g.closePath();
    g.fillStyle='rgba(230,238,248,0.85)'; g.fill();

    R.push({ x:(cx0-0.34*P)/W, y:(cy-0.34*P)/H, w:0.68*P/W, h:0.68*P/H, kind:'play' });
    return R;
  },

  /* 大播放器（子页面用）*/
  player(g, W, H, w, st, idx){
    const P = W/5, R = [];
    const pad = 0.30*P;
    const art = 1.90*P;
    const ax = (W-art)/2, ay = 0.35*P;

    miniCover(g, ax, ay, art, art, '#4E5868', '#232830', true);

    g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillStyle='rgba(242,246,252,0.96)';
    g.font='500 '+Math.round(0.32*P)+'px '+FONT;
    g.fillText(w.title, W/2, ay+art+0.42*P);
    g.fillStyle='rgba(150,158,170,0.82)';
    g.font='400 '+Math.round(0.20*P)+'px '+FONT;
    g.fillText(w.artist, W/2, ay+art+0.72*P);

    const py = ay+art+1.00*P, ph = 0.07*P, prog = w.progress||0.34;
    g.fillStyle='rgba(255,255,255,0.10)';
    roundRect(g,pad,py,W-2*pad,ph,ph*0.5); g.fill();
    g.fillStyle='rgba(198,214,232,0.88)';
    roundRect(g,pad,py,(W-2*pad)*prog,ph,ph*0.5); g.fill();
    g.beginPath(); g.arc(pad+(W-2*pad)*prog, py+ph/2, ph*0.95, 0, Math.PI*2);
    g.fillStyle='rgba(226,238,250,0.95)'; g.fill();

    g.textAlign='left';
    g.fillStyle='rgba(150,158,170,0.72)';
    g.font='400 '+Math.round(0.16*P)+'px '+FONT;
    g.fillText('01:14', pad, py+0.28*P);
    g.textAlign='right';
    g.fillText('03:37', W-pad, py+0.28*P);
    g.textAlign='left';

    const cy = py+0.62*P, cx0 = W/2, gap = 1.10*P;
    g.strokeStyle='rgba(230,238,248,0.85)';
    g.lineWidth=Math.max(1.5,0.05*P); g.lineCap='round';
    /* 上一首 */
    g.beginPath(); g.moveTo(cx0-gap-0.11*P, cy-0.15*P); g.lineTo(cx0-gap-0.11*P, cy+0.15*P); g.stroke();
    g.beginPath(); g.moveTo(cx0-gap+0.12*P, cy); g.lineTo(cx0-gap-0.10*P, cy-0.15*P); g.lineTo(cx0-gap-0.10*P, cy+0.15*P); g.closePath();
    g.fillStyle='rgba(230,238,248,0.85)'; g.fill();
    /* 播放 / 暂停 */
    g.fillStyle='rgba(255,255,255,0.10)';
    g.beginPath(); g.arc(cx0,cy,0.30*P,0,Math.PI*2); g.fill();
    g.strokeStyle='rgba(255,255,255,0.16)'; g.lineWidth=1.5;
    g.beginPath(); g.arc(cx0,cy,0.30*P,0,Math.PI*2); g.stroke();
    g.fillStyle='rgba(242,248,255,0.95)';
    if(st.playing){
      g.beginPath(); g.moveTo(cx0-0.08*P,cy-0.14*P); g.lineTo(cx0+0.14*P,cy); g.lineTo(cx0-0.08*P,cy+0.14*P); g.closePath(); g.fill();
    } else {
      roundRect(g,cx0-0.13*P,cy-0.14*P,0.09*P,0.28*P,0.02*P); g.fill();
      roundRect(g,cx0+0.04*P,cy-0.14*P,0.09*P,0.28*P,0.02*P); g.fill();
    }
    /* 下一首 */
    g.strokeStyle='rgba(230,238,248,0.85)';
    g.beginPath(); g.moveTo(cx0+gap+0.11*P, cy-0.15*P); g.lineTo(cx0+gap+0.11*P, cy+0.15*P); g.stroke();
    g.beginPath(); g.moveTo(cx0+gap-0.12*P, cy); g.lineTo(cx0+gap+0.10*P, cy-0.15*P); g.lineTo(cx0+gap+0.10*P, cy+0.15*P); g.closePath();
    g.fillStyle='rgba(230,238,248,0.85)'; g.fill();

    R.push({ x:(cx0-0.38*P)/W, y:(cy-0.38*P)/H, w:0.76*P/W, h:0.76*P/H, kind:'play' });
    return R;
  },

  /* 歌词（当前句高亮）*/
  lyrics(g, W, H, w, st, idx){
    const P = W/5, pad = 0.30*P;
    label(g, w.label || '歌词', pad, 0.48*P, P);
    const lines = w.lines || [];
    const cur = w.current || 0;
    let y = 1.00*P;
    const lh = 0.44*P;
    lines.forEach((t,i)=>{
      const on = (i === cur);
      g.textAlign='left'; g.textBaseline='alphabetic';
      g.fillStyle = on ? 'rgba(236,242,250,0.95)' : 'rgba(140,148,162,0.60)';
      g.font = (on?'500 ':'400 ') + Math.round((on?0.27:0.23)*P) + 'px ' + FONT;
      g.fillText(t, pad, y);
      y += lh;
    });
    return [];
  },

  /* ============================================================
     空间播放器的「裸元素」（无卡片底板，直接浮在空间里）
  ============================================================ */

  /* 封面：圆角方形专辑图 */
  cover(g,W,H,w,st,idx){
    const P = W/5;
    const r = H*0.13;
    const a = track().accent.split(',').map(Number);
    const c1 = 'rgb(' + Math.min(255,a[0]+40) + ',' + Math.min(255,a[1]+40) + ',' + Math.min(255,a[2]+44) + ')';
    const c2 = 'rgb(' + Math.max(0,a[0]-52) + ',' + Math.max(0,a[1]-50) + ',' + Math.max(0,a[2]-46) + ')';

    g.save();
    roundRect(g,0,0,W,H,r); g.clip();
    const grd = g.createLinearGradient(0,0,W,H);
    grd.addColorStop(0,c1); grd.addColorStop(1,c2);
    g.fillStyle = grd; g.fillRect(0,0,W,H);

    const rg = g.createRadialGradient(W*0.30,H*0.24,10,W*0.30,H*0.24,W*0.95);
    rg.addColorStop(0,'rgba(198,204,212,0.18)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0,0,W,H);

    g.strokeStyle = 'rgba(255,255,255,0.20)'; g.lineWidth = Math.max(2,0.018*P);
    for(let i=0;i<3;i++){
      g.beginPath(); g.arc(W*0.44,H*0.44,W*(0.15+i*0.10), Math.PI*0.10, Math.PI*0.92); g.stroke();
    }
    g.strokeStyle = 'rgba(255,255,255,0.09)'; g.lineWidth = 2;
    g.beginPath(); g.arc(W*0.44,H*0.44,W*0.44,0,Math.PI*2); g.stroke();

    const hg = g.createLinearGradient(0,0,0,H*0.35);
    hg.addColorStop(0,'rgba(198,204,212,0.14)'); hg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(0,0,W,H*0.35);
    g.restore();

    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 2;
    roundRect(g,1,1,W-2,H-2,r-1); g.stroke();
    return [];
  },

  /* 歌词：整首歌画进一张长图，靠 tex.offset 平滑滚动 */
  lyric3d(g,W,H,w,st,idx){
    const P = wp(W,w);
    const lines = track().lyrics;
    const cur = NP.lyricIdx || 0;
    const lh = 0.62*P;
    const top = lh*1.3;
    const padX = 0.10*P;
    const maxW = W - padX*2;          // 可用宽度

    g.textAlign='center'; g.textBaseline='middle';
    lines.forEach((l,i)=>{
      const d = Math.abs(i-cur);
      let alpha, size, weight;
      if(d === 0){      alpha = 0.97; size = 0.33*P; weight = 500; }
      else if(d === 1){ alpha = 0.44; size = 0.27*P; weight = 400; }
      else if(d === 2){ alpha = 0.22; size = 0.25*P; weight = 400; }
      else {            alpha = 0.10; size = 0.24*P; weight = 400; }

      /* ⚠️ 自适应：这一行太长就自动缩小字号，保证完整显示、绝不截断 */
      g.font = weight + ' ' + Math.round(size) + 'px ' + FONT;
      const tw = g.measureText(l.s).width;
      if(tw > maxW){
        size = size * maxW / tw;
        g.font = weight + ' ' + Math.round(size) + 'px ' + FONT;
      }

      g.fillStyle = 'rgba(240,246,254,' + alpha + ')';
      g.fillText(l.s, W/2, top + i*lh);
    });
    return [];
  },

  /* 歌曲信息（裸）*/
  meta(g,W,H,w,st,idx){
    const P = wp(W,w);
    const t = track();
    g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillStyle='rgba(242,246,252,0.97)';
    g.font='600 '+Math.round(0.28*P)+'px '+FONT;
    g.fillText(t.title, W/2, H*0.40);
    g.fillStyle='rgba(154,162,176,0.9)';
    g.font='400 '+Math.round(0.16*P)+'px '+FONT;
    g.fillText(t.artist + ' · ' + t.album, W/2, H*0.66);
    g.fillStyle='rgba(150,158,170,0.5)';
    g.font='400 '+Math.round(0.12*P)+'px '+FONT;
    g.fillText('LOSSLESS · 44.1 kHz', W/2, H*0.88);
    return [];
  },

  /* 作者 · 专辑（夹在封面与进度条之间的一行）*/
  nowinfo(g,W,H,w,st,idx){
    const P = wp(W,w);
    const t = track();
    g.textAlign='center'; g.textBaseline='middle';
    g.fillStyle='rgba(188,198,214,0.92)';
    g.font='400 '+Math.round(0.30*P)+'px '+FONT;
    g.fillText(t.artist + ' · ' + t.album, W/2, H*0.5);
    return [];
  },

  /* 播放控制（裸）：进度可拖 + 上一首/播放/下一首 */
  transport(g,W,H,w,st,idx){
    const P = wp(W,w), R = [];
    const pad = 0.18*P;
    const t = track();
    const prog = t.dur ? Math.min(1, NP.cur/t.dur) : 0;

    const py = H*0.20, ph = 0.06*P;
    g.fillStyle='rgba(255,255,255,0.14)';
    roundRect(g,pad,py,W-2*pad,ph,ph*0.5); g.fill();
    g.fillStyle='rgba(198,214,232,0.92)';
    roundRect(g,pad,py,(W-2*pad)*prog,ph,ph*0.5); g.fill();
    g.beginPath(); g.arc(pad+(W-2*pad)*prog, py+ph/2, ph*0.95,0,Math.PI*2);
    g.fillStyle='#EAF2FB'; g.fill();

    /* 时间数字：放大、提亮，确保一眼可见 */
    g.fillStyle='rgba(190,200,216,0.92)';
    g.font='500 '+Math.round(0.30*P)+'px '+FONT;
    g.textAlign='left'; g.textBaseline='alphabetic';
    g.fillText(fmt(NP.cur), pad, py+0.42*P);
    g.textAlign='right'; g.fillText(fmt(t.dur), W-pad, py+0.42*P);
    g.textAlign='left';

    const cy = H*0.70, cx0 = W/2, gap = 0.80*P;
    g.lineCap='round';
    g.strokeStyle='rgba(230,238,248,0.85)'; g.lineWidth=Math.max(1.5,0.038*P);
    g.beginPath(); g.moveTo(cx0-gap-0.08*P, cy-0.11*P); g.lineTo(cx0-gap-0.08*P, cy+0.11*P); g.stroke();
    g.beginPath(); g.moveTo(cx0-gap+0.09*P, cy); g.lineTo(cx0-gap-0.07*P, cy-0.11*P); g.lineTo(cx0-gap-0.07*P, cy+0.11*P); g.closePath();
    g.fillStyle='rgba(230,238,248,0.85)'; g.fill();

    g.fillStyle='rgba(255,255,255,0.09)';
    g.beginPath(); g.arc(cx0,cy,0.26*P,0,Math.PI*2); g.fill();
    g.strokeStyle='rgba(255,255,255,0.16)'; g.lineWidth=1.5;
    g.beginPath(); g.arc(cx0,cy,0.26*P,0,Math.PI*2); g.stroke();
    g.fillStyle='rgba(242,248,255,0.95)';
    if(NP.playing){
      g.beginPath(); g.moveTo(cx0-0.06*P,cy-0.12*P); g.lineTo(cx0+0.12*P,cy); g.lineTo(cx0-0.06*P,cy+0.12*P); g.closePath(); g.fill();
    } else {
      roundRect(g,cx0-0.11*P,cy-0.12*P,0.08*P,0.24*P,0.02*P); g.fill();
      roundRect(g,cx0+0.03*P,cy-0.12*P,0.08*P,0.24*P,0.02*P); g.fill();
    }

    g.strokeStyle='rgba(230,238,248,0.85)';
    g.beginPath(); g.moveTo(cx0+gap+0.08*P, cy-0.11*P); g.lineTo(cx0+gap+0.08*P, cy+0.11*P); g.stroke();
    g.beginPath(); g.moveTo(cx0+gap-0.09*P, cy); g.lineTo(cx0+gap+0.07*P, cy-0.11*P); g.lineTo(cx0+gap+0.07*P, cy+0.11*P); g.closePath();
    g.fillStyle='rgba(230,238,248,0.85)'; g.fill();

    R.push({ x:pad/W, y:(py-0.16*P)/H, w:(W-2*pad)/W, h:(ph+0.32*P)/H, kind:'seek' });
    R.push({ x:(cx0-0.34*P)/W, y:(cy-0.34*P)/H, w:0.68*P/W, h:0.68*P/H, kind:'play' });
    R.push({ x:(cx0-gap-0.32*P)/W, y:(cy-0.32*P)/H, w:0.64*P/W, h:0.64*P/H, kind:'prev' });
    R.push({ x:(cx0+gap-0.32*P)/W, y:(cy-0.32*P)/H, w:0.64*P/W, h:0.64*P/H, kind:'next' });
    return R;
  },

  /* 播放队列（裸）*/
  queue(g,W,H,w,st,idx){
    const P = wp(W,w), pad = 0.18*P;
    g.textAlign='left'; g.textBaseline='alphabetic';
    g.fillStyle='rgba(150,158,170,0.6)';
    g.font='400 '+Math.round(0.13*P)+'px '+FONT;
    g.fillText('接下来播放', pad, 0.40*P);
    const items = w.items || [];
    const rh = 0.52*P;
    let y = 0.86*P;
    items.forEach((it,i)=>{
      g.fillStyle='rgba(232,238,246,0.9)';
      g.font='400 '+Math.round(0.17*P)+'px '+FONT;
      g.textAlign='left';
      g.fillText(it.t, pad, y);
      g.fillStyle='rgba(146,154,168,0.7)';
      g.font='400 '+Math.round(0.13*P)+'px '+FONT;
      g.textAlign='right'; g.fillText(it.s, W-pad, y); g.textAlign='left';
      y += rh;
    });
    return [];
  },

  /* ============================================================
     统计图表（2026-09-22 新增，移植 LX-Pro Stats 的图表体系）
     参考：LX-Pro src/screens/Home/Views/Stats/
       · RadarChart.tsx      六维雷达图
       · DonutChart.tsx      平台占比环形图（色板在 :15）
       · index.tsx:721-740   24 小时柱状图（最高峰高亮）
     本项目用 Canvas 2D 手绘（LX-Pro 用 react-native-svg），
     语义一致、实现路径不同。
  ============================================================ */

  /* 24 小时柱状图：柱高按最大值归一化，最高峰高亮
     LX-Pro 原实现：柱高归一化到 64px，topHour 用主色高亮 */
  chart_bar24(g, W, H, w, st, idx){
    const P = W/5;
    const pad = 0.30*P;
    let y = 0;
    if(w.label){ label(g, w.label, pad, 0.48*P, P); y = 0.72*P; }

    const bars = w.bars || [];
    const n = bars.length;
    const maxV = Math.max.apply(null, bars.concat([0.001]));
    const topIdx = w.top !== undefined ? w.top : bars.indexOf(maxV);

    /* 基线 + 柱区 */
    const baseY = H - 0.62*P;
    const maxH  = (baseY - y) * 0.86;
    const slot  = (W - 2*pad) / n;
    const bw    = slot * 0.62;

    bars.forEach((v, i) => {
      const bh = Math.max(2, maxH * (v / maxV));
      const bx = pad + i*slot + (slot - bw)/2;
      const isTop = (i === topIdx);
      g.fillStyle = isTop ? 'rgba(198,214,232,0.92)' : 'rgba(255,255,255,0.16)';
      roundRect(g, bx, baseY - bh, bw, bh, Math.min(bw*0.32, 0.06*P)); g.fill();
      /* 最高峰加发光描边 */
      if(isTop){
        g.strokeStyle = 'rgba(226,238,250,0.55)'; g.lineWidth = 1.5;
        roundRect(g, bx, baseY - bh, bw, bh, Math.min(bw*0.32, 0.06*P)); g.stroke();
      }
    });

    /* 小时刻度：0 / 6 / 12 / 18 / 23 */
    g.fillStyle = 'rgba(158,170,186,0.80)';
    g.font = '400 ' + Math.round(0.19*P) + 'px ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    [0, 6, 12, 18, 23].forEach(h => {
      if(h >= n) return;
      g.fillText(String(h), pad + h*slot + slot/2, baseY + 0.34*P);
    });
    g.textAlign = 'left';

    /* 最高峰标注 */
    if(w.topLabel){
      g.fillStyle = 'rgba(226,238,250,0.92)';
      g.font = '500 ' + Math.round(0.21*P) + 'px ' + FONT;
      g.textAlign = 'right';
      g.fillText(w.topLabel, W - pad, y + 0.10*P);
      g.textAlign = 'left';
    }
    return [];
  },

  /* 六维雷达图：多边形 + 网格 + 轴标签
     LX-Pro 维度（Stats/index.tsx:71-76）：
       多样性 / 深夜 / 循环 / 完听 / 活跃 / 探索 */
  chart_radar(g, W, H, w, st, idx){
    const P = W/5;
    const items = w.items || [];
    const n = items.length;
    if(!n) return [];

    const cx = W/2;
    /* 留出上方标签空间 */
    const labelH = 0.34*P;
    const cy = labelH + (H - labelH - 0.18*P)/2;
    const R  = Math.min(W*0.34, (H - labelH - 0.36*P)/2);

    const ang = i => -Math.PI/2 + i * Math.PI*2/n;

    /* 网格：3 层同心多边形 */
    for(let layer = 1; layer <= 3; layer++){
      const r = R * layer/3;
      g.strokeStyle = 'rgba(255,255,255,' + (layer === 3 ? 0.16 : 0.08) + ')';
      g.lineWidth = 1.2;
      g.beginPath();
      for(let i = 0; i < n; i++){
        const a = ang(i);
        const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath(); g.stroke();
    }

    /* 轴线 */
    g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1;
    for(let i = 0; i < n; i++){
      const a = ang(i);
      g.beginPath(); g.moveTo(cx, cy);
      g.lineTo(cx + Math.cos(a)*R, cy + Math.sin(a)*R); g.stroke();
    }

    /* 数据多边形（填充 + 描边）*/
    g.beginPath();
    items.forEach((it, i) => {
      const a = ang(i);
      const r = R * Math.max(0, Math.min(1, it.value || 0));
      const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.closePath();
    g.fillStyle = 'rgba(150,180,215,0.26)'; g.fill();
    g.strokeStyle = 'rgba(206,222,240,0.85)'; g.lineWidth = 2; g.stroke();

    /* 顶点小圆点 */
    items.forEach((it, i) => {
      const a = ang(i);
      const r = R * Math.max(0, Math.min(1, it.value || 0));
      g.beginPath();
      g.arc(cx + Math.cos(a)*r, cy + Math.sin(a)*r, 0.045*P, 0, Math.PI*2);
      g.fillStyle = 'rgba(232,242,252,0.95)'; g.fill();
    });

    /* 轴标签 */
    g.fillStyle = 'rgba(178,188,204,0.92)';
    g.font = '500 ' + Math.round(0.21*P) + 'px ' + FONT;
    items.forEach((it, i) => {
      const a = ang(i);
      const lx = cx + Math.cos(a)*(R + 0.30*P);
      const ly = cy + Math.sin(a)*(R + 0.30*P);
      const cosv = Math.cos(a);
      g.textAlign = Math.abs(cosv) < 0.3 ? 'center' : (cosv > 0 ? 'left' : 'right');
      g.textBaseline = Math.sin(a) > 0.3 ? 'top' : (Math.sin(a) < -0.3 ? 'bottom' : 'middle');
      g.fillText(it.label || '', lx, ly);
    });
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    return [];
  },

  /* 环形图：各平台占比（LX-Pro DonutChart.tsx）
     strokeWidth = size*0.14；中心显示累计值；右侧图例带百分比
     色板沿用 LX-Pro 的 DEFAULT_COLORS（DonutChart.tsx:15） */
  chart_donut(g, W, H, w, st, idx){
    const P = W/5;
    const items = w.items || [];
    const COLORS = ['#4daf7c','#f59e0b','#3b82f6','#8b5cf6','#ef4444','#14b8a6','#f97316','#64748b'];
    const total = items.reduce((s, it) => s + (it.value || 0), 0) || 1;

    /* 左侧圆环 + 右侧图例 */
    const labelH = w.label ? 0.72*P : 0.10*P;
    const availH = H - labelH - 0.16*P;
    const R  = Math.min(W*0.19, availH*0.42);
    const cx = 0.30*P + R;
    const cy = labelH + availH/2;
    const sw = R * 0.28;              /* 环宽 ≈ size*0.14 */

    if(w.label) label(g, w.label, 0.30*P, 0.48*P, P);

    /* 底色环 */
    g.strokeStyle = 'rgba(255,255,255,0.08)';
    g.lineWidth = sw;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.stroke();

    /* 数据弧（从 -90° 开始顺时针）*/
    let a0 = -Math.PI/2;
    items.forEach((it, i) => {
      const frac = (it.value || 0) / total;
      const a1 = a0 + frac * Math.PI*2;
      if(frac > 0){
        g.strokeStyle = it.color || COLORS[i % COLORS.length];
        g.lineWidth = sw;
        g.lineCap = 'butt';
        g.beginPath(); g.arc(cx, cy, R, a0, a1); g.stroke();
      }
      a0 = a1;
    });

    /* 中心文字：累计值 + 单位 */
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(243,247,252,0.96)';
    g.font = '600 ' + Math.round(0.34*P) + 'px ' + FONT;
    g.fillText(w.centerValue || String(Math.round(total)), cx, cy - 0.06*P);
    if(w.centerUnit){
      g.fillStyle = 'rgba(168,178,192,0.85)';
      g.font = '400 ' + Math.round(0.19*P) + 'px ' + FONT;
      g.fillText(w.centerUnit, cx, cy + 0.28*P);
    }

    /* 右侧图例 */
    const lx = cx + R + 0.34*P;
    const rowH = Math.min(0.42*P, availH / Math.max(1, items.length));
    let ly = cy - (items.length*rowH)/2 + rowH/2;
    items.forEach((it, i) => {
      const frac = (it.value || 0) / total;
      /* 色点 */
      g.beginPath(); g.arc(lx + 0.07*P, ly, 0.065*P, 0, Math.PI*2);
      g.fillStyle = it.color || COLORS[i % COLORS.length]; g.fill();
      /* 名称 */
      g.textAlign = 'left'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(228,234,242,0.92)';
      g.font = '400 ' + Math.round(0.21*P) + 'px ' + FONT;
      g.fillText(it.label || '', lx + 0.22*P, ly);
      /* 百分比（右对齐）*/
      g.textAlign = 'right';
      g.fillStyle = 'rgba(158,170,186,0.85)';
      g.font = '500 ' + Math.round(0.20*P) + 'px ' + FONT;
      g.fillText(Math.round(frac*100) + '%', W - 0.24*P, ly);
      ly += rowH;
    });
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    return [];
  },

  /* 指标组（2026-09-22 新增）
     用途：承载「标签 + 数值」型的成组信息，如 LX-Pro 统计页的
       · 本月听歌报告：听歌时长 / 播放次数 / 活跃天数 / 今年活跃
       · 本月最常听  ：最爱歌手 / 最爱歌曲 / 最爱专辑
       · 听歌习惯    ：常听时段 / 活跃日均 / 最长连续 / 本月活跃
       · 长期偏好画像：常听歌手 / 常听专辑 / 常听音源
     这些区块在 LX-Pro 里是「标题 + 若干指标行」，不是图表。
     参数：
       w.items = [{ label:'听歌时长', value:'38.2 小时' }, ...]
       w.cols  = 1 或 2（默认 1）—— 2 列时并排显示，省纵向空间 */
  metrics(g, W, H, w, st, idx){
    const P = W/5;
    const pad = 0.30*P;
    let y = 0;
    if(w.label){ label(g, w.label, pad, 0.48*P, P); y = 0.76*P; }
    if(w.sub){
      g.fillStyle = 'rgba(150,160,176,0.78)';
      g.font = '400 ' + Math.round(0.19*P) + 'px ' + FONT;
      g.textAlign = 'right'; g.textBaseline = 'alphabetic';
      g.fillText(w.sub, W - pad, 0.46*P);
      g.textAlign = 'left';
    }

    const items = w.items || [];
    const cols  = w.cols === 2 ? 2 : 1;
    const avail = H - y - 0.18*P;
    const rows  = Math.ceil(items.length / cols);
    const rowH  = Math.min(0.86*P, avail / Math.max(1, rows));
    const colW  = (W - 2*pad) / cols;

    items.forEach((it, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      const x = pad + c*colW;
      const ry = y + r*rowH;

      /* 标签（上，小、灰）*/
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.fillStyle = 'rgba(158,170,186,0.88)';
      g.font = '400 ' + Math.round(0.20*P) + 'px ' + FONT;
      g.fillText(it.label || '', x, ry + rowH*0.38);

      /* 数值（下，大、亮）*/
      g.fillStyle = 'rgba(240,246,254,0.96)';
      g.font = '600 ' + Math.round(0.30*P) + 'px ' + FONT;
      const vw = g.measureText(it.value || '').width;
      const maxVW = colW - 0.24*P;
      if(vw > maxVW){
        g.font = '600 ' + Math.round(0.30*P * maxVW / vw) + 'px ' + FONT;
      }
      g.fillText(it.value || '', x, ry + rowH*0.80);

      /* 分隔线（非末行）*/
      if(r < rows - 1 && cols === 1){
        hairline(g, pad, ry + rowH - 0.02*P, W - pad, 0.05);
      }
    });
    return [];
  },

  /* 折线图（2026-09-22 新增）
     移植 LX-Pro ActivityCompareChart.tsx（本月实线 vs 上月虚线）
     参数：w.values = [数值数组]、w.labels = [标签]、
           w.compare = [对比数组]（可选，画成虚线） */
  chart_line(g, W, H, w, st, idx){
    const P = W/5;
    const pad = 0.34*P;
    let y = 0;
    if(w.label){ label(g, w.label, pad, 0.48*P, P); y = 0.80*P; }
    if(w.sub){
      g.fillStyle = 'rgba(158,170,186,0.82)';
      g.font = '400 ' + Math.round(0.19*P) + 'px ' + FONT;
      g.textAlign = 'right'; g.textBaseline = 'alphabetic';
      g.fillText(w.sub, W - pad, 0.46*P);
      g.textAlign = 'left';
    }

    const vals = w.values || [];
    const n = vals.length;
    if(n < 2) return [];

    const all = vals.concat(w.compare || []);
    const maxV = Math.max.apply(null, all.concat([0.001]));
    const baseY = H - 0.52*P;
    const topY  = y + 0.16*P;
    const hgt   = baseY - topY;
    const x0 = pad, x1 = W - pad;
    const dx = (x1 - x0) / (n - 1);

    /* 横向网格线 */
    g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = 1;
    for(let i = 0; i <= 3; i++){
      const gy = topY + hgt * i/3;
      g.beginPath(); g.moveTo(x0, gy); g.lineTo(x1, gy); g.stroke();
    }

    /* 对比线（虚线，LX-Pro 的「上月」）*/
    if(w.compare && w.compare.length === n){
      g.strokeStyle = 'rgba(150,168,190,0.55)';
      g.lineWidth = 1.6;
      g.setLineDash([0.14*P, 0.12*P]);
      g.beginPath();
      w.compare.forEach((v, i) => {
        const px = x0 + i*dx, py = baseY - (v/maxV)*hgt;
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      });
      g.stroke();
      g.setLineDash([]);
    }

    /* 主折线 + 面积填充 */
    g.beginPath();
    vals.forEach((v, i) => {
      const px = x0 + i*dx, py = baseY - (v/maxV)*hgt;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    });
    g.strokeStyle = 'rgba(206,222,240,0.92)'; g.lineWidth = 2.2; g.stroke();

    g.lineTo(x1, baseY); g.lineTo(x0, baseY); g.closePath();
    const grd = g.createLinearGradient(0, topY, 0, baseY);
    grd.addColorStop(0, 'rgba(150,180,215,0.28)');
    grd.addColorStop(1, 'rgba(150,180,215,0.02)');
    g.fillStyle = grd; g.fill();

    /* 数据点 */
    vals.forEach((v, i) => {
      const px = x0 + i*dx, py = baseY - (v/maxV)*hgt;
      g.beginPath(); g.arc(px, py, 0.05*P, 0, Math.PI*2);
      g.fillStyle = 'rgba(232,242,252,0.95)'; g.fill();
    });

    /* 最高点标注 */
    const mxI = vals.indexOf(Math.max.apply(null, vals));
    g.fillStyle = 'rgba(226,238,250,0.92)';
    g.font = '500 ' + Math.round(0.20*P) + 'px ' + FONT;
    g.textAlign = 'center';
    g.fillText(w.fmt ? w.fmt(vals[mxI]) : vals[mxI].toFixed(1),
               x0 + mxI*dx, baseY - (vals[mxI]/maxV)*hgt - 0.22*P);

    /* X 轴标签（稀疏显示，避免拥挤）*/
    const step = Math.max(1, Math.ceil(n / 6));
    g.fillStyle = 'rgba(158,170,186,0.80)';
    g.font = '400 ' + Math.round(0.18*P) + 'px ' + FONT;
    (w.labels || []).forEach((lb, i) => {
      if(i % step !== 0 && i !== n-1) return;
      g.fillText(lb, x0 + i*dx, baseY + 0.30*P);
    });
    g.textAlign = 'left';
    return [];
  },

  /* 每日热力日历（2026-09-22 新增）
     ⚠️ 移植 LX-Pro MonthHeatMap.tsx，但**不做整年**：
        真实数据只有 11 天，整年热力图会大片空白。
        改为按实际天数排布（自动决定列数）。 */
  chart_heat(g, W, H, w, st, idx){
    const P = W/5;
    const pad = 0.32*P;
    let y = 0;
    if(w.label){ label(g, w.label, pad, 0.48*P, P); y = 0.82*P; }
    if(w.sub){
      g.fillStyle = 'rgba(158,170,186,0.82)';
      g.font = '400 ' + Math.round(0.19*P) + 'px ' + FONT;
      g.textAlign = 'right'; g.textBaseline = 'alphabetic';
      g.fillText(w.sub, W - pad, 0.46*P);
      g.textAlign = 'left';
    }

    const days = w.days || [];        /* [{label:'08-23', value:2.23}] */
    const n = days.length;
    if(!n) return [];

    const maxV = Math.max.apply(null, days.map(d => d.value).concat([0.001]));
    /* 自动列数：按可用宽度与格子大小 */
    const cellGap = 0.10*P;
    const cols = Math.min(n, Math.max(4, Math.floor((W - 2*pad) / (0.62*P + cellGap))));
    const rows = Math.ceil(n / cols);
    const availH = H - y - 0.42*P;
    const cell = Math.min(0.62*P, (availH - (rows-1)*cellGap) / rows);

    /* 色阶：0 → 最深（LX-Pro getHeatColor 思路，用本项目冷灰蓝）*/
    const heat = t => {
      if(t <= 0) return 'rgba(255,255,255,0.06)';
      const a = 0.16 + 0.66*Math.min(1, t);
      return 'rgba(150,180,215,' + a.toFixed(3) + ')';
    };

    days.forEach((d, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      const cx = pad + c*(cell + cellGap);
      const cy = y + r*(cell + cellGap);
      g.fillStyle = heat(d.value / maxV);
      roundRect(g, cx, cy, cell, cell, cell*0.22); g.fill();
      /* 边框 */
      g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = 1;
      roundRect(g, cx, cy, cell, cell, cell*0.22); g.stroke();
    });

    /* 图例：少 → 多 */
    const ly = y + rows*(cell + cellGap) + 0.20*P;
    g.fillStyle = 'rgba(158,170,186,0.80)';
    g.font = '400 ' + Math.round(0.18*P) + 'px ' + FONT;
    g.textBaseline = 'middle';
    g.textAlign = 'left';
    g.fillText('少', pad, ly + cell*0.2);
    const lx0 = pad + 0.34*P;
    for(let i = 0; i < 5; i++){
      g.fillStyle = heat(i/4);
      roundRect(g, lx0 + i*(cell*0.44 + 0.06*P), ly, cell*0.44, cell*0.40, cell*0.10); g.fill();
    }
    g.textAlign = 'left';
    g.fillText('多', lx0 + 5*(cell*0.44 + 0.06*P) + 0.08*P, ly + cell*0.2);
    g.textBaseline = 'alphabetic';
    return [];
  },

  /* ============================================================
     P3 播放页扩展（2026-09-22）
     移植 LX-Pro：
       · MoreBtn/index.tsx:123-127      底部按钮行
       · PlayDetailMenu.tsx:66-85       更多菜单
       · SettingPopup/                  播放设置弹窗
     ⚠️ 去掉平台依赖项：桌面歌词（移动端概念）、评论、歌手/专辑/相似歌曲（需联网平台）
  ============================================================ */

  /* 更多按钮行（LX-Pro MoreBtn 的空间化版本）
     LX-Pro 是 5 个按钮 space-around；本项目保留有数据支撑的：
       添加到歌单 / 播放模式 / 更多菜单
     做成「一行三个图标按钮」，点击区域独立。 */
  morebtn(g, W, H, w, st, idx){
    const P = wp(W,w);
    const btns = w.items || [];
    const n = btns.length;
    if(!n) return [];
    const R = [];
    const slot = W / n;
    const cy = H * 0.5;
    const r  = Math.min(slot*0.30, H*0.34);

    btns.forEach((b, i) => {
      const cx = slot*(i + 0.5);
      const active = (st.sel === i);

      /* 圆形底 */
      g.fillStyle = active ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.07)';
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.fill();
      g.strokeStyle = active ? 'rgba(200,216,236,0.38)' : 'rgba(255,255,255,0.12)';
      g.lineWidth = 1.4;
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.stroke();

      /* 图标（线性绘制，与 drawMenuGlyph 同风格）*/
      drawPlayIcon(g, b.icon, cx, cy, r*0.86, active);

      R.push({ x:(cx-r)/W, y:(cy-r)/H, w:2*r/W, h:2*r/H,
               kind:'pbtn', index:i, title:b.title, action:b.action });
    });
    return R;
  },

  /* 更多菜单（LX-Pro PlayDetailMenu 的空间化版本）
     做成「环绕面」而非弹窗 —— 符合 docs/10「环绕比弹层高级」。
     条目：下载 / 复制歌名 / 喜欢 / 歌曲来源详情（去掉全部平台依赖项）*/
  playmenu(g, W, H, w, st, idx){
    const P = wp(W,w);
    const pad = 0.30*P;
    const items = w.items || [];
    const n = items.length;
    if(!n) return [];
    const R = [];
    let y = 0;
    if(w.label){ label(g, w.label, pad, 0.52*P, P); y = 0.82*P; }
    const rowH = Math.min(0.80*P, (H - y - 0.20*P) / n);

    items.forEach((it, i) => {
      const ry = y + i*rowH;
      const on = (st.sel === i);
      if(on){
        g.fillStyle = 'rgba(255,255,255,0.07)';
        roundRect(g, pad*0.4, ry+0.03*P, W-pad*0.8, rowH-0.06*P, 0.13*P); g.fill();
      }
      /* 左侧图标点 */
      g.beginPath(); g.arc(pad + 0.10*P, ry + rowH*0.5, 0.075*P, 0, Math.PI*2);
      g.fillStyle = it.on ? 'rgba(206,222,240,0.95)' : 'rgba(255,255,255,0.22)';
      g.fill();

      g.textAlign = 'left'; g.textBaseline = 'middle';
      g.fillStyle = it.on ? 'rgba(244,248,254,0.98)' : 'rgba(228,234,242,0.92)';
      g.font = '500 ' + Math.round(0.27*P) + 'px ' + FONT;
      g.fillText(it.t, pad + 0.30*P, ry + rowH*0.5);

      if(it.s){
        g.textAlign = 'right';
        g.fillStyle = 'rgba(178,188,204,0.86)';
        g.font = '400 ' + Math.round(0.21*P) + 'px ' + FONT;
        g.fillText(it.s, W - pad, ry + rowH*0.5);
        g.textAlign = 'left';
      }
      if(i < n-1) hairline(g, pad + 0.30*P, ry+rowH, W-pad, 0.05);

      R.push({ x:0, y:ry/H, w:1, h:rowH/H, kind:'pmenu', index:i, title:it.t, action:it.action });
    });
    return R;
  },

  /* 播放设置（LX-Pro SettingPopup 的空间化版本）
     歌词字号（滑块）/ 歌词对齐（三选）/ 显示控制栏（开关）
     做成「环绕面」：滑块可拖动、对齐可点、开关可切换。 */
  playsetting(g, W, H, w, st, idx){
    const P = wp(W,w);
    const pad = 0.30*P;
    const R = [];
    let y = 0;
    if(w.label){ label(g, w.label, pad, 0.52*P, P); y = 0.92*P; }

    /* ① 歌词字号：标签 + 数值 + 滑块 */
    const lrcSize = (st.lrcSize !== undefined) ? st.lrcSize : (w.lrcSize || 0.5);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillStyle = 'rgba(196,206,220,0.92)';
    g.font = '400 ' + Math.round(0.24*P) + 'px ' + FONT;
    g.fillText('歌词字号', pad, y + 0.24*P);
    g.textAlign = 'right';
    g.fillStyle = 'rgba(240,246,254,0.96)';
    g.font = '500 ' + Math.round(0.24*P) + 'px ' + FONT;
    g.fillText(Math.round(12 + lrcSize*16) + 'px', W - pad, y + 0.24*P);
    g.textAlign = 'left';

    const sy = y + 0.46*P, sh = 0.10*P;
    g.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(g, pad, sy, W-2*pad, sh, sh*0.5); g.fill();
    g.fillStyle = 'rgba(198,214,232,0.88)';
    roundRect(g, pad, sy, (W-2*pad)*lrcSize, sh, sh*0.5); g.fill();
    g.beginPath(); g.arc(pad + (W-2*pad)*lrcSize, sy+sh/2, sh*1.05, 0, Math.PI*2);
    g.fillStyle = 'rgba(232,242,252,0.96)'; g.fill();
    R.push({ x:pad/W, y:(sy-sh)/H, w:(W-2*pad)/W, h:(sh*3)/H, kind:'pslider', id:'lrcSize' });
    y += 0.86*P;

    /* ② 歌词对齐：三选 */
    g.fillStyle = 'rgba(196,206,220,0.92)';
    g.font = '400 ' + Math.round(0.24*P) + 'px ' + FONT;
    g.fillText('歌词对齐', pad, y + 0.24*P);
    const aligns = w.aligns || ['左','中','右'];
    const curA = (st.align !== undefined) ? st.align : (w.align || 1);
    const aw = (W - 2*pad - 0.30*P) / 3;
    aligns.forEach((a, i) => {
      const ax = pad + i*(aw + 0.15*P);
      const on = (i === curA);
      g.fillStyle = on ? 'rgba(50,90,150,0.38)' : 'rgba(255,255,255,0.05)';
      roundRect(g, ax, y + 0.36*P, aw, 0.40*P, 0.14*P); g.fill();
      g.strokeStyle = on ? 'rgba(184,200,220,0.5)' : 'rgba(255,255,255,0.09)';
      g.lineWidth = 1.4;
      roundRect(g, ax, y + 0.36*P, aw, 0.40*P, 0.14*P); g.stroke();
      g.fillStyle = on ? 'rgba(242,246,252,0.96)' : 'rgba(202,210,222,0.85)';
      g.font = '500 ' + Math.round(0.22*P) + 'px ' + FONT;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(a, ax + aw/2, y + 0.56*P);
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      R.push({ x:ax/W, y:(y+0.36*P)/H, w:aw/W, h:0.40*P/H, kind:'palign', index:i, value:a });
    });
    y += 0.92*P;

    /* ③ 显示控制栏：开关 */
    const showCtrl = (st.showCtrl !== undefined) ? st.showCtrl : (w.showCtrl !== false);
    g.fillStyle = 'rgba(196,206,220,0.92)';
    g.font = '400 ' + Math.round(0.24*P) + 'px ' + FONT;
    g.textBaseline = 'middle';
    g.fillText('显示控制栏', pad, y + 0.20*P);
    const tw = 0.62*P, th = 0.34*P, tx = W - pad - tw, ty = y + 0.20*P - th/2;
    g.fillStyle = showCtrl ? 'rgba(154,176,200,0.85)' : 'rgba(255,255,255,0.11)';
    roundRect(g, tx, ty, tw, th, th*0.5); g.fill();
    if(showCtrl){
      g.strokeStyle = 'rgba(200,216,236,0.35)'; g.lineWidth = 1.4;
      roundRect(g, tx, ty, tw, th, th*0.5); g.stroke();
    }
    const kr = th*0.36;
    g.beginPath();
    g.arc(showCtrl ? (tx + tw - th*0.5) : (tx + th*0.5), ty + th/2, kr, 0, Math.PI*2);
    g.fillStyle = showCtrl ? 'rgba(18,20,24,0.92)' : 'rgba(196,204,216,0.8)';
    g.fill();
    R.push({ x:(tx-0.1*P)/W, y:(ty-0.1*P)/H, w:(tw+0.2*P)/W, h:(th+0.2*P)/H, kind:'pswitch', id:'showCtrl' });
    g.textBaseline = 'alphabetic';
    return R;
  },

  /* 头图卡（2026-09-22，P2 专辑/歌手详情）
     移植 LX-Pro AlbumDetail/Header.tsx + ArtistDetail/Header.tsx：
       LX-Pro 结构 = 头图（封面/头像）+ 名称 + 统计 + 操作按钮行
     ⚠️ 数据来自 REAL.albums / REAL.artists（本地聚合），不依赖平台接口
     参数：
       w.kind   'album' | 'artist'
       w.title  专辑名 / 歌手名
       w.sub    副标题（歌手名 / 专辑数·歌曲数）
       w.stats  [{label,value}] 统计项（如 歌曲 20 / 专辑 3）
       w.actions [{icon,title,action}] 操作按钮 */
  headcard(g, W, H, w, st, idx){
    const P = wp(W,w);
    const pad = 0.30*P;
    const R = [];

    /* ① 头图（方形，圆角）*/
    const artSize = Math.min(W*0.34, H*0.52);
    const ax = pad, ay = pad*0.6;
    const cc = w.kind === 'artist' ? ['#46525E','#262E36']
             : w.kind === 'playlist' ? ['#4A5464','#2A3038']
             : ['#3E4E58','#242C32'];
    const grd = g.createLinearGradient(ax, ay, ax+artSize, ay+artSize);
    grd.addColorStop(0, cc[0]); grd.addColorStop(1, cc[1]);
    g.fillStyle = grd;
    roundRect(g, ax, ay, artSize, artSize, artSize*0.10); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1.5;
    roundRect(g, ax, ay, artSize, artSize, artSize*0.10); g.stroke();

    if(w.kind === 'playlist'){
      /* 歌单：画堆叠卡片示意 */
      g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 1.5;
      for(let k = 0; k < 3; k++){
        const off = (k-1)*artSize*0.10;
        roundRect(g, ax+artSize*0.16+off, ay+artSize*0.22+off,
                  artSize*0.68, artSize*0.56, artSize*0.06); g.stroke();
      }
    } else if(w.kind === 'artist'){
      /* 歌手：画头像轮廓 + 首字 */
      g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 1.5;
      g.beginPath(); g.arc(ax+artSize/2, ay+artSize*0.38, artSize*0.17, 0, Math.PI*2); g.stroke();
      g.beginPath(); g.arc(ax+artSize/2, ay+artSize*0.95, artSize*0.32, Math.PI*1.05, Math.PI*1.95); g.stroke();
    } else {
      /* 专辑：画唱片环 */
      g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 1.5;
      g.beginPath(); g.arc(ax+artSize/2, ay+artSize/2, artSize*0.32, 0, Math.PI*2); g.stroke();
      g.beginPath(); g.arc(ax+artSize/2, ay+artSize/2, artSize*0.10, 0, Math.PI*2); g.stroke();
    }
    /* 首字（大、淡）*/
    g.fillStyle = 'rgba(244,248,252,0.20)';
    g.font = '600 ' + Math.round(artSize*0.30) + 'px ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText((w.title || '?').slice(0,1), ax+artSize/2, ay+artSize*0.56);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';

    /* ② 右侧文字区 */
    const tx = ax + artSize + 0.34*P;
    const tw = W - tx - pad;

    /* 类型标签 */
    g.fillStyle = 'rgba(158,170,186,0.85)';
    g.font = '500 ' + Math.round(0.19*P) + 'px ' + FONT;
    g.fillText(w.kind === 'artist' ? '歌手'
             : w.kind === 'playlist' ? '歌单' : '专辑', tx, ay + 0.26*P);

    /* 标题（最多 2 行）*/
    g.fillStyle = 'rgba(244,248,254,0.98)';
    g.font = '600 ' + Math.round(0.34*P) + 'px ' + FONT;
    const maxTW = tw;
    let title = w.title || '';
    let tw1 = g.measureText(title).width;
    if(tw1 > maxTW){
      g.font = '600 ' + Math.round(0.34*P * maxTW / tw1) + 'px ' + FONT;
    }
    g.fillText(title, tx, ay + 0.74*P, maxTW);

    /* 副标题 */
    if(w.sub){
      g.fillStyle = 'rgba(178,188,204,0.90)';
      g.font = '400 ' + Math.round(0.22*P) + 'px ' + FONT;
      g.fillText(w.sub, tx, ay + 1.10*P, maxTW);
    }

    /* 统计项（横排）*/
    const stats = w.stats || [];
    let sx = tx;
    const sy = ay + 1.52*P;
    stats.forEach((it, i) => {
      g.fillStyle = 'rgba(240,246,254,0.96)';
      g.font = '600 ' + Math.round(0.26*P) + 'px ' + FONT;
      const vw = g.measureText(it.value).width;
      g.fillText(it.value, sx, sy);
      g.fillStyle = 'rgba(158,170,186,0.85)';
      g.font = '400 ' + Math.round(0.19*P) + 'px ' + FONT;
      g.fillText(it.label, sx + vw + 0.10*P, sy);
      sx += vw + 0.10*P + g.measureText(it.label).width + 0.44*P;
      if(sx > W - pad - 0.6*P) return;
    });

    /* ③ 操作按钮行（底部）*/
    const acts = w.actions || [];
    if(acts.length){
      const by = H - pad*0.6 - 0.62*P;
      const slot = (W - 2*pad) / acts.length;
      acts.forEach((a, i) => {
        const bx = pad + slot*i;
        const on = (st.sel === i);
        g.fillStyle = on ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.07)';
        roundRect(g, bx + 0.06*P, by, slot - 0.12*P, 0.62*P, 0.20*P); g.fill();
        g.strokeStyle = on ? 'rgba(200,216,236,0.38)' : 'rgba(255,255,255,0.12)';
        g.lineWidth = 1.4;
        roundRect(g, bx + 0.06*P, by, slot - 0.12*P, 0.62*P, 0.20*P); g.stroke();

        drawPlayIcon(g, a.icon, bx + slot/2 - 0.52*P, by + 0.31*P, 0.44*P, on);
        g.fillStyle = on ? 'rgba(244,248,254,0.98)' : 'rgba(214,224,238,0.90)';
        g.font = '500 ' + Math.round(0.20*P) + 'px ' + FONT;
        g.textAlign = 'left'; g.textBaseline = 'middle';
        g.fillText(a.title, bx + slot/2 - 0.22*P, by + 0.32*P);
        g.textAlign = 'left'; g.textBaseline = 'alphabetic';

        R.push({ x:(bx+0.06*P)/W, y:by/H, w:(slot-0.12*P)/W, h:0.62*P/H,
                 kind:'hact', index:i, title:a.title, action:a.action });
      });
    }
    return R;
  },

  /* 纯文本 */
  text(g, W, H, w, st, idx){
    const P = W/5;
    const pad = 0.32*P;
    let y = 0;
    if(w.label){ label(g, w.label, pad, 0.52*P, P); y = 0.72*P; }
    g.fillStyle = 'rgba(198,206,218,0.85)';
    g.font = '400 ' + Math.round(0.25*P) + 'px ' + FONT;
    g.textAlign='left'; g.textBaseline='alphabetic';
    g.fillText(w.text, pad, y + 0.28*P);
    return [];
  }
};

/* 控件高度（世界单位）*/
const _mc = document.createElement('canvas').getContext('2d');

/* 估算 chips 需要几行（按实际文字宽度换行）*/
function chipsRows(items, canvasW){
  const P = canvasW/5;
  _mc.font = '400 ' + Math.round(0.26*P) + 'px ' + FONT;
  const pad = 0.28*P;
  const avail = canvasW - 2*pad;
  const gap = 0.18*P;
  let x = 0, rows = 1;
  items.forEach(t => {
    const cw = _mc.measureText(t).width + 0.52*P;
    if(x > 0 && x + cw > avail){ rows++; x = cw + gap; }
    else x += cw + gap;
  });
  return rows;
}

function widgetHeight(w){
  const ww = w.w || PAGE_W;
  const PX = ww * PPM;          // 该控件画布宽度（像素）
  const P  = PX/5;              // 排版基准
  switch(w.type){
    case 'search': return 1.45;
    case 'chips': {
      const rows = chipsRows(w.items, PX);
      const top = 0.34*P + (w.label ? 0.46*P : 0);
      return (top + rows*0.54*P + (rows-1)*0.18*P + 0.30*P) / PPM;
    }
    case 'list':   return (0.64*P*(w.label?1:0) + 0.85*P*w.items.length + 0.30*P) / PPM;
    case 'tabs':   return (0.52*P + 0.48*P) / PPM;
    case 'grid': {
      const pad = 0.30*P, gap = 0.26*P;
      const cw = (PX - 2*pad - gap) / 2;
      const artH = cw * 0.74;
      const rows = Math.ceil(w.items.length / 2);
      return (0.74*P + rows*(artH + 0.90*P) + 0.36*P) / PPM;
    }
    case 'songrow': return (0.74*P*(w.label?1:0) + 0.78*P*w.items.length + 0.40*P) / PPM;
    case 'stat':   return 2.05;
    case 'bars':   return (0.68*P*(w.label?1:0) + 0.72*P*w.items.length + 0.28*P) / PPM;
    case 'toggle': return (0.68*P*(w.label?1:0) + 0.82*P*w.items.length + 0.26*P) / PPM;
    case 'now':    return 2.95;
    case 'player': return 4.20;
    case 'lyrics': return 2.60;
    case 'text':   return (0.72*P*(w.label?1:0) + 0.28*P + 0.42*P) / PPM;
    default:       return 1.5;
  }
}

/* ---------------- 主页卡片贴图（每张卡内容各不相同）---------------- */
const CARD_PPM = 200;   // 每世界单位 200 像素

/* 卡片底板：圆角裁切（真圆角）+ 冷暖分级 */
function drawCardBg(g, W, H, i){
  const [a,b] = PALETTES[i % PALETTES.length];
  const r = H*0.11;
  g.save();
  roundRect(g,0,0,W,H,r); g.clip();

  const grd = g.createLinearGradient(0,0,W*0.85,H);
  grd.addColorStop(0,a); grd.addColorStop(1,b);
  g.fillStyle = grd; g.fillRect(0,0,W,H);

  const sg = g.createLinearGradient(0,H,0,H*0.35);
  sg.addColorStop(0,'rgba(38,72,94,0.20)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = sg; g.fillRect(0,0,W,H);

  const hg = g.createRadialGradient(W*0.88,H*0.10,4,W*0.88,H*0.10,W*0.75);
  hg.addColorStop(0,'rgba(198,204,212,0.10)'); hg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = hg; g.fillRect(0,0,W,H);

  g.fillStyle = 'rgba(208,213,220,0.30)';
  g.fillRect(W*0.07, H*0.075, W*0.86, 1.4);
  g.restore();

  g.strokeStyle = 'rgba(255,255,255,0.14)';
  g.lineWidth = 2;
  roundRect(g,1,1,W-2,H-2,r-1); g.stroke();
}

/* 小工具 */
function cardEn(g, text, x, y, size){
  g.fillStyle = 'rgba(158,166,178,0.80)';
  g.font = '400 ' + Math.round(size||23) + 'px ' + FONT;
  if('letterSpacing' in g) g.letterSpacing = '5px';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText(text, x, y);
  if('letterSpacing' in g) g.letterSpacing = '0px';
}
function cardCn(g, text, x, y, size){
  g.fillStyle = 'rgba(240,243,247,0.95)';
  g.font = '500 ' + Math.round(size||46) + 'px ' + FONT;
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText(text, x, y);
}
function miniToggle(g, x, y, w, h, on){
  g.fillStyle = on ? 'rgba(154,176,200,0.85)' : 'rgba(255,255,255,0.11)';
  roundRect(g, x, y, w, h, h*0.5); g.fill();
  const kr = h*0.36, kx = on ? (x+w-h*0.5) : (x+h*0.5);
  g.fillStyle = on ? 'rgba(18,20,24,0.92)' : 'rgba(196,204,216,0.8)';
  g.beginPath(); g.arc(kx, y+h/2, kr, 0, Math.PI*2); g.fill();
}
function miniCover(g, x, y, w, h, c1, c2, disc){
  const grd = g.createLinearGradient(x,y,x+w,y+h);
  grd.addColorStop(0,c1); grd.addColorStop(1,c2);
  g.fillStyle = grd;
  roundRect(g, x, y, w, h, w*0.12); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1.5;
  roundRect(g, x, y, w, h, w*0.12); g.stroke();
  if(disc){
    g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(x+w/2, y+h/2, w*0.28, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.arc(x+w/2, y+h/2, w*0.16, 0, Math.PI*2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.14)';
    g.beginPath(); g.arc(x+w/2, y+h/2, w*0.055, 0, Math.PI*2); g.fill();
  }
}

function makeMainCardTexture(f, i){
  const cw = f.w || 3.4, ch = f.h || 2.2;
  const c = document.createElement('canvas');
  c.width  = Math.round(cw * CARD_PPM);
  c.height = Math.round(ch * CARD_PPM);
  const g = c.getContext('2d');
  drawCardBg(g, c.width, c.height, i);
  const fn = CARD[f.key];
  if(fn) fn(g, c.width, c.height, f);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeHaloTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(128,128,8,128,128,128);
  rg.addColorStop(0,'rgba(186,200,218,0.85)');
  rg.addColorStop(0.42,'rgba(120,138,160,0.30)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const HALO_TEX = makeHaloTexture();

function makeSoftDotTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,'rgba(255,255,255,0.95)');
  rg.addColorStop(0.32,'rgba(206,222,240,0.30)');
  rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0,0,64,64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* 菜单图标：简洁线性 glyph */
/* 播放页按钮图标（2026-09-22，P3）
   3 个图标：add(添加到歌单) / mode(播放模式) / more(更多)
   风格与 drawMenuGlyph 一致：线性、圆头、亮色。 */
function drawPlayIcon(g, icon, cx, cy, s, active){
  const sw = Math.max(1.4, s*0.13);
  g.strokeStyle = active ? 'rgba(240,246,254,0.98)' : 'rgba(214,224,238,0.90)';
  g.fillStyle   = active ? 'rgba(240,246,254,0.98)' : 'rgba(214,224,238,0.90)';
  g.lineWidth = sw; g.lineCap = 'round'; g.lineJoin = 'round';
  const r = s*0.42;

  switch(icon){
    case 'add':   /* 加号 */
      g.beginPath();
      g.moveTo(cx - r, cy); g.lineTo(cx + r, cy);
      g.moveTo(cx, cy - r); g.lineTo(cx, cy + r);
      g.stroke();
      break;
    case 'mode':  /* 循环箭头 */
      g.beginPath();
      g.arc(cx, cy, r*0.82, Math.PI*0.15, Math.PI*1.55);
      g.stroke();
      g.beginPath();
      g.moveTo(cx + r*0.72, cy - r*0.62);
      g.lineTo(cx + r*0.30, cy - r*0.50);
      g.lineTo(cx + r*0.62, cy - r*0.10);
      g.closePath(); g.fill();
      break;
    case 'more':  /* 三点竖排 */
      [-1, 0, 1].forEach(k => {
        g.beginPath(); g.arc(cx, cy + k*r*0.72, sw*0.85, 0, Math.PI*2); g.fill();
      });
      break;
    case 'heart': /* 心形 */
      g.beginPath();
      g.moveTo(cx, cy + r*0.42);
      g.quadraticCurveTo(cx - r*1.15, cy - r*0.55, cx - r*0.34, cy - r*0.78);
      g.quadraticCurveTo(cx, cy - r*0.20, cx, cy + r*0.62);
      g.quadraticCurveTo(cx, cy - r*0.20, cx + r*0.34, cy - r*0.78);
      g.quadraticCurveTo(cx + r*1.15, cy - r*0.55, cx, cy + r*0.42);
      g.stroke();
      break;
    case 'down':  /* 下载箭头 */
      g.beginPath();
      g.moveTo(cx, cy - r*0.72); g.lineTo(cx, cy + r*0.30);
      g.moveTo(cx - r*0.44, cy - r*0.10); g.lineTo(cx, cy + r*0.34);
      g.lineTo(cx + r*0.44, cy - r*0.10);
      g.moveTo(cx - r*0.62, cy + r*0.72); g.lineTo(cx + r*0.62, cy + r*0.72);
      g.stroke();
      break;
    case 'copy':  /* 复制 */
      g.strokeRect(cx - r*0.66, cy - r*0.66, r*1.02, r*1.02);
      g.strokeRect(cx - r*0.34, cy - r*0.34, r*1.02, r*1.02);
      break;
    default:
      g.beginPath(); g.arc(cx, cy, r*0.6, 0, Math.PI*2); g.stroke();
  }
}

function drawMenuGlyph(g, key, cx, cy, s){
  const sw = Math.max(1.5, s*0.12);
  g.strokeStyle = 'rgba(232,240,250,0.92)';
  g.lineWidth = sw; g.lineCap = 'round'; g.lineJoin = 'round';
  const p = s*0.9, q = s*0.28;
  switch(key){
    case 'home':
      g.beginPath(); g.moveTo(cx,cy-q); g.lineTo(cx-p,cy+s*0.28); g.lineTo(cx-p,cy+q);
      g.moveTo(cx,cy-q); g.lineTo(cx+p,cy+s*0.28); g.lineTo(cx+p,cy+q); g.stroke();
      break;
    case 'search':
      g.beginPath(); g.arc(cx-q,cy-q,q,0,Math.PI*2); g.stroke();
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+q*0.7,cy+q*0.7); g.stroke();
      break;
    case 'history':
      g.beginPath(); g.arc(cx,cy,q,0,Math.PI*2); g.stroke();
      g.beginPath(); g.moveTo(cx,cy-q); g.lineTo(cx,cy); g.lineTo(cx+q,cy); g.stroke();
      break;
    case 'songlist':
      g.beginPath();
      g.moveTo(cx-p,cy-q); g.lineTo(cx+p,cy-q);
      g.moveTo(cx-p,cy); g.lineTo(cx+p*0.6,cy);
      g.moveTo(cx-p,cy+q); g.lineTo(cx,cy+q); g.stroke();
      g.beginPath(); g.arc(cx+q,cy+q,q*0.6,0,Math.PI*2); g.stroke();
      break;
    case 'leaderboard':
      g.beginPath();
      g.moveTo(cx-p,cy+q); g.lineTo(cx-p,cy-q);
      g.moveTo(cx,cy+q); g.lineTo(cx,cy-q);
      g.moveTo(cx+p,cy+q); g.lineTo(cx+p,cy+q*0.2); g.stroke();
      break;
    case 'love':
      g.beginPath();
      g.moveTo(cx,cy+q*0.3);
      g.quadraticCurveTo(cx-p,cy-q, cx-q*0.3,cy-q);
      g.quadraticCurveTo(cx,cy-q*0.2, cx,cy+q*0.5);
      g.quadraticCurveTo(cx,cy-q*0.2, cx+q*0.3,cy-q);
      g.quadraticCurveTo(cx+p,cy-q, cx,cy+q*0.3); g.stroke();
      break;
    case 'daily':
      g.strokeRect(cx-p, cy-q, p*2, q*1.8);
      g.beginPath(); g.moveTo(cx-p,cy-q+q*0.6); g.lineTo(cx+p,cy-q+q*0.6); g.stroke();
      g.beginPath(); g.moveTo(cx-p*0.5,cy-q*1.2); g.lineTo(cx-p*0.5,cy-q*0.6);
      g.moveTo(cx+p*0.5,cy-q*1.2); g.lineTo(cx+p*0.5,cy-q*0.6); g.stroke();
      break;
    case 'artists':
      g.beginPath(); g.arc(cx,cy-q,q*0.55,0,Math.PI*2); g.stroke();
      g.beginPath(); g.arc(cx,cy+q*0.4,q*0.9,Math.PI,0); g.stroke();
      break;
    case 'albums':
      g.beginPath(); g.arc(cx,cy,q*0.95,0,Math.PI*2); g.stroke();
      g.beginPath(); g.arc(cx,cy,q*0.55,0,Math.PI*2); g.stroke();
      break;
    case 'myplaylist':
      g.beginPath();
      g.moveTo(cx-p,cy-q); g.lineTo(cx+p,cy-q);
      g.moveTo(cx-p,cy); g.lineTo(cx+p,cy);
      g.moveTo(cx-p,cy+q); g.lineTo(cx+p*0.5,cy+q); g.stroke();
      break;
    case 'onedrive':
    case 'webdav':
      g.beginPath();
      g.arc(cx,cy,q*0.4,q*0.7,Math.PI*1.9);
      g.arc(cx,cy,q*0.4,q*1.05,Math.PI*1.65);
      g.stroke();
      break;
    case 'stats':
      g.beginPath();
      g.moveTo(cx-p,cy+q); g.lineTo(cx-p,cy);
      g.moveTo(cx-p*0.35,cy+q); g.lineTo(cx-p*0.35,cy-q*0.6);
      g.moveTo(cx+p*0.35,cy+q); g.lineTo(cx+p*0.35,cy-q*0.2);
      g.moveTo(cx+p,cy+q); g.lineTo(cx+p,cy+q*0.4); g.stroke();
      break;
    case 'settings':
      g.beginPath(); g.arc(cx,cy,q*0.5,0,Math.PI*2); g.stroke();
      for(let i=0;i<8;i++){
        const a = i*Math.PI/4;
        g.beginPath();
        g.moveTo(cx+Math.cos(a)*q, cy+Math.sin(a)*q);
        g.lineTo(cx+Math.cos(a)*(q*1.4), cy+Math.sin(a)*(q*1.4)); g.stroke();
      }
      break;
  }
}

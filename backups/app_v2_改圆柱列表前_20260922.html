let dragging=false, lastX=0, lastY=0, downX=0, downY=0, moved=false;
let yaw=0, pitch=0, curYaw=0, curPitch=0;

/* 角度归一化：yaw 可无限增长，把它和 curYaw 同时减去相同的 2π 倍数，
   画面完全不变，但数值回到 ±π 附近，避免进子页面时"回卷"转一大圈。*/
function normalizeYaw(){
  const k = Math.round(yaw / (Math.PI*2));
  if(k !== 0){
    yaw    -= k * Math.PI * 2;
    curYaw -= k * Math.PI * 2;
    savedYaw -= k * Math.PI * 2;
  }
}

let idleT = 0;
function pokeUI(){ idleT = 0; document.body.classList.remove('idle'); }
['touchstart','touchmove','mousedown','mousemove','wheel','keydown']
  .forEach(ev => addEventListener(ev, pokeUI, {passive:true}));

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function currentList(){
  if(mode === 'main') return mainPanels;
  if(mode === 'sub')  return subPanels;
  return [];
}

/* 当前子页面可以自定义相机行为（如空间播放器转动范围更大）*/
let curPageKey = null;
function camCfg(){
  if(mode === 'main') return CAM.main;
  if(mode === 'sub' && curPageKey && PAGES[curPageKey] && PAGES[curPageKey].cam)
    return PAGES[curPageKey].cam;
  return CAM.sub;
}

/* 射线拾取 & 区域命中（3D 空间里的控件交互）*/
function raycastWidget(x,y){
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((x-rect.left)/rect.width)*2-1;
  pointer.y = -((y-rect.top)/rect.height)*2+1;
  scene.updateMatrixWorld(true);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(currentList(), false);
  return hits.length ? hits[0] : null;
}
function hitRegion(hit){
  if(!hit || !hit.uv) return null;
  const u = hit.object.userData;
  const fx = hit.uv.x, fy = 1 - hit.uv.y;
  for(const r of u.regions){
    if(fx >= r.x && fx <= r.x + r.w && fy >= r.y && fy <= r.y + r.h)
      return { r, mesh: hit.object, fx };
  }
  return null;
}

/* 拖动进度条 */
let seekDrag = false;
function seekTo(mesh, fx, r){
  const ratio = Math.max(0, Math.min(1, (fx - r.x) / r.w));
  NP.cur = ratio * track().dur;
  lastSec = -1;
  redrawNowType('transport');
  redrawNowType('lyric3d');
}

/* ============================================================
   交互
============================================================ */
function onDown(x,y){
  dragging=true; lastX=x; lastY=y; downX=x; downY=y; moved=false;
  seekDrag = false;
  if(mode === 'sub'){
    const g = hitRegion(raycastWidget(x,y));
    if(g && g.r.kind === 'seek'){
      seekDrag = true;
      seekTo(g.mesh, g.fx, g.r);
    }
  }
}
function onMove(x,y){
  if(!dragging) return;
  if(Math.abs(x-downX)>6 || Math.abs(y-downY)>6) moved=true;

  /* 正在拖动进度条 */
  if(seekDrag){
    const g = hitRegion(raycastWidget(x,y));
    if(g && g.r.kind === 'seek') seekTo(g.mesh, g.fx, g.r);
    lastX=x; lastY=y;
    return;
  }

  if(!busy){
    const cfg = camCfg();
    yaw   -= (x-lastX)*cfg.sensX;
    pitch -= (y-lastY)*cfg.sensY;
    yaw   = Math.max(-cfg.yawMax, Math.min(cfg.yawMax, yaw));
    pitch = Math.max(-cfg.pitchMax, Math.min(cfg.pitchMax, pitch));
  }
  lastX=x; lastY=y;
}
function onUp(x,y){
  dragging=false;
  seekDrag=false;
  if(!moved) pick(x,y);
}
function pick(x,y){
  if(busy) return;
  const hit = raycastWidget(x,y);
  if(!hit) return;
  if(mode === 'main'){ enterSection(hit.object); return; }
  const g = hitRegion(hit);
  if(g) handleRegion(g.mesh, g.r);
}

/* ⚠️ 关键：手机上 touchend 之后系统还会补发一次合成 mouseup，
   若两者都处理，点击会被执行两次（开关翻转两次=弹回原样）。
   用一个时间戳，在触摸后的一小段时间内忽略所有鼠标事件。*/
let lastTouchTs = 0;
const MOUSE_AFTER_TOUCH = 800;   // ms
function mouseIsSynthetic(){ return (Date.now() - lastTouchTs) < MOUSE_AFTER_TOUCH; }

canvas.addEventListener('touchstart', e=>{
  lastTouchTs = Date.now();
  onDown(e.touches[0].clientX, e.touches[0].clientY);
},{passive:true});
canvas.addEventListener('touchmove', e=>{
  lastTouchTs = Date.now();
  onMove(e.touches[0].clientX, e.touches[0].clientY);
},{passive:true});
canvas.addEventListener('touchend', e=>{
  lastTouchTs = Date.now();
  const t = e.changedTouches[0];
  onUp(t.clientX, t.clientY);
},{passive:true});
canvas.addEventListener('touchcancel', ()=>{ lastTouchTs = Date.now(); dragging = false; },{passive:true});

canvas.addEventListener('mousedown', e=>{ if(mouseIsSynthetic()) return; onDown(e.clientX,e.clientY); });
canvas.addEventListener('mousemove', e=>{ if(mouseIsSynthetic()) return; onMove(e.clientX,e.clientY); });
canvas.addEventListener('mouseup',   e=>{ if(mouseIsSynthetic()) return; onUp(e.clientX,e.clientY); });
canvas.addEventListener('mouseleave', ()=>{ dragging=false; });

/* ============================================================
   控件行为
============================================================ */
let searchMesh = null;

/* 我的歌单：tabs / grid / songrow 三者联动 */
function updateSongList(songs, title){
  const list = pageByKey[curPageKey] || [];
  list.filter(m => m.userData.widget.type === 'songrow').forEach(m => {
    m.userData.widget.label = title;
    m.userData.widget.items = songs;
    m.userData.state.items = JSON.parse(JSON.stringify(songs));
    m.userData.state.sel = -1;
    redrawWidget(m);
  });
}
function syncPlaylistSet(setKey){
  const data = PLAYLIST_DATA[setKey] || [];
  const list = pageByKey[curPageKey] || [];
  const gm = list.find(m => m.userData.widget.type === 'grid');
  if(gm){
    gm.userData.widget.items = data.map(pl => ({ t:pl.t, sub:pl.sub, g:pl.g, songs:pl.songs }));
    gm.userData.state.items = JSON.parse(JSON.stringify(gm.userData.widget.items));
    gm.userData.state.sel = 0;
    redrawWidget(gm);
  }
  if(data[0]) updateSongList(data[0].songs, data[0].t);
}

function handleRegion(mesh, r){
  const u = mesh.userData;
  switch(r.kind){
    case 'searchInput':
    case 'searchGo':
      searchMesh = mesh;
      openSheet();
      break;
    case 'chip':
      u.state.sel = (u.state.sel === r.index) ? -1 : r.index;
      redrawWidget(mesh);
      u.hl = 0.8;
      toast('已选择：' + r.value);
      break;
    case 'row':
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.8;
      toast(r.title + ' · ' + r.sub);
      break;
    case 'tab': {
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.7;
      const setKey = (u.widget.sets || [])[r.index];
      if(setKey) syncPlaylistSet(setKey);
      toast('已切换：' + r.value);
      break;
    }
    case 'cell': {
      const it = u.state.items[r.index];
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.8;
      if(it && it.songs) updateSongList(it.songs, it.t);
      toast('已打开：' + r.title);
      break;
    }
    case 'song': {
      u.state.sel = r.index;
      redrawWidget(mesh);
      u.hl = 0.7;
      toast(r.title + ' · ' + r.sub);
      break;
    }
    case 'toggle': {
      const it = u.state.items[r.index];
      it.v = !it.v;
      redrawWidget(mesh);
      u.hl = 0.6;
      toast(it.t + '：' + (it.v ? '已开启' : '已关闭'));
      break;
    }
    case 'play':
      setPlaying(!NP.playing);
      redrawWidget(mesh);
      u.hl = 0.6;
      break;
    case 'prev': switchTrack(-1); break;
    case 'next': switchTrack(1);  break;
    case 'seek': break;   /* 由拖动处理 */
  }
}

/* ============================================================
   搜索输入面板
============================================================ */
const sheetEl = document.getElementById('sheet');
const sheetInput = document.getElementById('sheetInput');

function openSheet(){
  sheetEl.classList.add('on');
  setTimeout(() => sheetInput.focus(), 260);
}
function closeSheet(){ sheetEl.classList.remove('on'); sheetInput.blur(); }

document.getElementById('sheetGo').addEventListener('click', submitSearch);
sheetInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitSearch(); });
sheetEl.addEventListener('click', e => { if(e.target === sheetEl) closeSheet(); });

function submitSearch(){
  const v = sheetInput.value.trim();
  closeSheet();
  if(!v) return;
  if(searchMesh){
    searchMesh.userData.state.value = v;
    redrawWidget(searchMesh);
    searchMesh.userData.hl = 1;
  }
  toast('搜索：' + v);
}

/* ============================================================
   转场
============================================================ */
const wipeEl = document.getElementById('wipe');
const backBtn = document.getElementById('backBtn');
const crumbEn = document.getElementById('crumbEn');
const crumbCn = document.getElementById('crumbCn');

function wipe(on){ wipeEl.classList.toggle('on', on); }

function playEnter(list){
  list.forEach((m,i) => {
    m.userData.enterT = 0;
    m.userData.enterK = 0;
    m.userData.enterDelay = i * 0.055;
  });
}

/* 记住进入子页面前的视角，返回时还原 */
let savedYaw = 0, savedPitch = 0;

function enterSection(mesh){
  if(busy) return;
  busy = true;
  const key = mesh.userData.feature.key;
  document.body.classList.add('busy');

  /* 记录当前视角（先归一化，避免数值过大）*/
  normalizeYaw();
  savedYaw = yaw; savedPitch = pitch;

  flyCard = { mesh, t:0, dur:0.40 };
  setTimeout(() => wipe(true), 300);

  setTimeout(() => {
    mesh.position.copy(mesh.userData.home);
    mesh.scale.set(1,1,1);
    flyCard = null;

    mainGroup.visible = false;
    buildPage(key);
    activatePage(key);
    subGroup.visible = true;

    mode = 'sub';
    curPageKey = key;
    yaw = 0; pitch = 0;

    playEnter(subPanels);
    rebuildIndex(subPanels);

    /* 空间播放器：初始化歌词高亮与滚动位置 */
    if(key === 'now'){
      NP.lyricIdx = curLyricIndex();
      lastSec = -1;
      redrawNowPage();
      snapLyrics();
    }

    crumbEn.textContent = PAGES[key].en;
    crumbCn.textContent = PAGES[key].cn;
    document.body.classList.add('sub');
    backBtn.classList.add('on');

    wipe(false);
    busy = false;
    document.body.classList.remove('busy');
  }, 470);
}

function exitSection(){
  if(busy || mode !== 'sub') return;
  busy = true;
  document.body.classList.add('busy');
  closeSheet();
  wipe(true);

  setTimeout(() => {
    subGroup.visible = false;
    mainGroup.visible = true;
    mode = 'main';

    /* 还原进入前的视角（回到原来那张卡片的方向）*/
    yaw = savedYaw; pitch = savedPitch;

    playEnter(mainPanels);
    rebuildIndex(mainPanels);

    document.body.classList.remove('sub');
    backBtn.classList.remove('on');

    wipe(false);
    busy = false;
    document.body.classList.remove('busy');
  }, 260);
}
backBtn.addEventListener('click', exitSection);

/* ============================================================
   定位 / 索引栏 / 边缘指示
============================================================ */
function lookAtCard(mesh){
  if(busy) return;
  const cfg = camCfg();
  const d = mesh.position.clone().normalize();
  const targetPitch = Math.asin(THREE.MathUtils.clamp(d.y,-1,1));
  let targetYaw = Math.atan2(-d.x, -d.z);
  while(targetYaw - yaw >  Math.PI) targetYaw -= Math.PI*2;
  while(targetYaw - yaw < -Math.PI) targetYaw += Math.PI*2;
  yaw   = THREE.MathUtils.clamp(targetYaw,  -cfg.yawMax,   cfg.yawMax);
  pitch = THREE.MathUtils.clamp(targetPitch,-cfg.pitchMax, cfg.pitchMax);
  mesh.userData.hl = 1;
}

const indexBar = document.getElementById('indexBar');
function rebuildIndex(list){
  indexBar.innerHTML = '';
  list.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = m.userData.feature
      ? m.userData.feature.title
      : (m.userData.widget.label || m.userData.widget.type);
    chip.addEventListener('click', () => lookAtCard(m));
    indexBar.appendChild(chip);
  });
}

const indicators = document.getElementById('indicators');
const indPool = [];
function getInd(i){
  if(!indPool[i]){
    const el = document.createElement('div');
    el.className = 'ind';
    indicators.appendChild(el);
    indPool[i] = el;
  }
  return indPool[i];
}

const _v = new THREE.Vector3();
const _invQ = new THREE.Quaternion();

function updateIndicators(list){
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5));
  const aspect = innerWidth/innerHeight;
  _invQ.copy(camera.quaternion).invert();

  for(let i = 0; i < list.length; i++){
    const el = getInd(i);
    const m = list[i];
    if(!m.visible){ el.style.opacity = 0; continue; }
    _v.copy(m.position).sub(camera.position).applyQuaternion(_invQ);

    let nx, ny, visible;
    if(_v.z < -0.01){
      const d = -_v.z;
      nx = (_v.x/d)/(tanHalf*aspect);
      ny = (_v.y/d)/tanHalf;
      visible = Math.abs(nx) < 0.86 && Math.abs(ny) < 0.86;
    } else {
      const d = Math.max(0.01, _v.z);
      nx = -(_v.x/d)/(tanHalf*aspect);
      ny = -(_v.y/d)/tanHalf;
      visible = false;
    }
    if(visible){ el.style.opacity = 0; continue; }

    let mx = Math.abs(nx), my = Math.abs(ny);
    if(mx < 0.001 && my < 0.001){ nx = 0; ny = -1.5; mx = 0; my = 1.5; }
    const k = 1/Math.max(mx,my);
    const ex = THREE.MathUtils.clamp(nx*k, -0.93, 0.93);
    const ey = THREE.MathUtils.clamp(ny*k, -0.93, 0.93);
    el.style.left = ((ex*0.5+0.5)*100)+'%';
    el.style.top  = ((-ey*0.5+0.5)*100)+'%';
    el.style.transform = 'translate(-50%,-50%) rotate(' + (Math.atan2(ex,ey)*180/Math.PI) + 'deg)';
    el.style.opacity = 1;
  }
  for(let i = list.length; i < indPool.length; i++) indPool[i].style.opacity = 0;
}

/* ============================================================
   动画循环
============================================================ */
const clock = new THREE.Clock();
const _dir = new THREE.Vector3();
const _target = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  curYaw   += (yaw   - curYaw)   * Math.min(1, dt*6);
  curPitch += (pitch - curPitch) * Math.min(1, dt*6);

  camera.position.set(
    Math.sin(t*0.4)*0.12,
    Math.cos(t*0.31)*0.10,
    Math.sin(t*0.11)*0.55
  );
  camera.rotation.order = 'YXZ';
  camera.rotation.y = curYaw;
  camera.rotation.x = curPitch;
  camera.rotation.z = Math.sin(t*0.2)*0.005;

  motes.rotation.y += dt*0.012;
  motes.rotation.x += dt*0.004;

  idleT += dt;
  if(idleT > 6 && !busy) document.body.classList.add('idle');

  const list = currentList();
  for(const m of list){
    if(!m.visible) continue;
    const u = m.userData;

    if(u.enterK < 1){
      u.enterT += dt;
      const k = Math.min(1, Math.max(0, (u.enterT - u.enterDelay)/0.5));
      u.enterK = 1 - Math.pow(1-k, 3);
    }
    const ek = u.enterK;

    if(u.hl > 0.002) u.hl *= Math.pow(0.06, dt); else u.hl = 0;

    /* 漂浮：默认轻微呼吸；float:0 的控件完全不漂（保持间距稳定）*/
    const amp = (u.floatAmp === undefined) ? 0.14 : u.floatAmp;
    const off = Math.sin(t*0.5 + u.phase) * amp * ek;
    m.position.copy(u.home).multiplyScalar(1 + 1.7*(1-ek)).addScaledVector(u.floatDir, off);
    m.scale.setScalar((0.45 + 0.55*ek) * (1 + u.hl*0.16));

    /* 朝向：默认始终正对镜头；标了 tilt 的则「固定倾斜」不跟随相机 */
    if(u.tilt === undefined){
      m.lookAt(camera.position);
    } else {
      const baseYaw = Math.atan2(-m.position.x, -m.position.z);
      m.rotation.order = 'YXZ';
      m.rotation.set(0, baseYaw + u.tilt, 0);
    }

    const dist = camera.position.distanceTo(m.position);
    const dof = THREE.MathUtils.clamp(1 - (dist-7)/34, 0.5, 1);
    const isFly = (flyCard && flyCard.mesh === m);
    const targetOp = isFly ? 1 : (busy ? 0 : dof*ek);
    u.faceMat.opacity += (targetOp - u.faceMat.opacity) * Math.min(1, dt*9);
    u.sideMat.opacity = u.faceMat.opacity;
    if(u.halo) u.halo.material.opacity = u.faceMat.opacity * (0.30 + u.hl*1.5);
  }

  if(flyCard){
    flyCard.t += dt;
    const k = Math.min(1, flyCard.t/flyCard.dur);
    const e = k*k;
    _dir.set(0,0,-1).applyQuaternion(camera.quaternion);
    _target.copy(camera.position).addScaledVector(_dir, 9 - 7.5*e);
    flyCard.mesh.position.copy(_target);
    flyCard.mesh.scale.setScalar(1 + e*8);
    flyCard.mesh.lookAt(camera.position);
    const fu = flyCard.mesh.userData;
    if(fu.faceMat) fu.faceMat.opacity = 1;
    if(fu.sideMat) fu.sideMat.opacity = 1;
    if(fu.halo)    fu.halo.material.opacity = 0.3;
  }

  /* 空间播放器：推进播放 / 歌词滚动 */
  nowTick(dt);

  updateIndicators(list);
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 启动 ---------------- */
rebuildIndex(mainPanels);
playEnter(mainPanels);
animate();

  else if(h < 11){  greet='Good morning.';   mood='早安。先放一首，慢慢醒过来。'; }
  else if(h < 14){  greet='Noon.';           mood='午后的光，有点懒。'; }
  else if(h < 18){  greet='Good afternoon.'; mood='这个点，适合听点旧的歌。'; }
  else if(h < 23){  greet='Good evening.';   mood='今晚也想听点安静的吗？'; }
  else {            greet='Late night.';     mood='夜深了，把声音调小一点。'; }
  document.getElementById('greet').textContent = greet;
  document.getElementById('mood').innerHTML = '<span class="dot"></span>' + mood;
})();

const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1600);
}

/* 底部迷你播放条：与歌曲页共用播放状态 */
document.getElementById('playBtn').addEventListener('click', function(){
  setPlaying(!NP.playing);
});
document.getElementById('miniNext').addEventListener('click', function(){
  switchTrack(1);
});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090C">
<title>LX Pro · 空间原型</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#08090C;
    font-family:-apple-system,"PingFang SC","HarmonyOS Sans",sans-serif;color:#ECEDEF;}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;}
  .logo{font-size:34px;font-weight:600;letter-spacing:-0.5px;
    background:linear-gradient(180deg,#22334E,#5E7290);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{font-size:12px;letter-spacing:3px;color:#4B4E54;text-transform:uppercase;}
  .tip{font-size:13px;line-height:1.9;color:#8C9097;max-width:340px;margin-top:8px;}
  .tip b{color:#ECEDEF;font-weight:500;}
  .go{display:inline-flex;align-items:center;gap:9px;margin-top:10px;
    padding:13px 30px;border-radius:24px;text-decoration:none;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);
    color:#ECEDEF;font-size:14px;letter-spacing:.6px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 14px 40px rgba(0,0,0,.6);transition:background .25s,transform .25s;}
  .go:active{background:rgba(255,255,255,.11);transform:scale(.97);}
  .warn{margin-top:14px;font-size:12px;color:#4B4E54;line-height:1.8;max-width:340px;}
  .dot{display:inline-block;width:5px;height:5px;border-radius:50%;
    background:#7A828C;box-shadow:0 0 10px rgba(122,130,140,.5);
    vertical-align:middle;margin-right:7px;animation:p 2.6s ease-in-out infinite;}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">LX Pro</div>
  <div class="sub">Spatial Prototype</div>
  <div class="tip">
    <span class="dot"></span><b>球面空间原型</b><br>
    拖动转视角 · 点卡片进子空间<br>
    长列表可拖动滚动，右侧细条可快速定位
  </div>
  <a class="go" href="./prototype/app.html">进入原型 →</a>
  <div class="warn">
    ⚠️ 请用<b>支持 WebGL 的手机浏览器</b>打开<br>
    某些 App 内置 WebView 会拦截本地脚本，换浏览器即可
  </div>
</div>
<script>
  /* 自动跳转：手机上直接进原型，省一次点击。
     桌面浏览器保留入口页（方便你手动切响应式模式）。*/
  (function(){
    var ua = navigator.userAgent || '';
    var mobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua);
    if (mobile) location.replace('./prototype/app.html');
  })();
</script>
</body>
</html>
